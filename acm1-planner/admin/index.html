<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Rooms Admin · Last Z SVS Planner</title><style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;background:#0b1422;color:#eaf2fc;--mint:#80dfc2;--muted:#a4b8ce;--line:#34485f}*{box-sizing:border-box}body{margin:0}header{background:#13243a;border-bottom:1px solid var(--line);padding:20px max(20px,calc((100vw - 1120px)/2));display:flex;align-items:center;justify-content:space-between;gap:15px}h1{font-size:22px;margin:0}header p{margin:5px 0 0;font-size:12px;color:var(--muted)}main{max-width:1160px;margin:auto;padding:26px 20px 70px}a{color:var(--mint)}button,input,select{font:inherit}button,.button{min-height:42px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #48617c;background:#20354c;color:#eaf2fc;border-radius:8px;padding:10px 13px;cursor:pointer;text-decoration:none}button:hover{border-color:var(--mint)}button:disabled{opacity:.45;cursor:wait}input,select{background:#0a192b;border:1px solid #48617c;color:#eff7ff;border-radius:8px;padding:11px;min-height:44px;width:100%}label{font-size:13px;color:var(--muted);display:block}label input{margin-top:7px}:focus-visible{outline:2px solid var(--mint);outline-offset:3px}.primary{background:var(--mint);border-color:var(--mint);color:#0b2a22;font-weight:750}.danger{border-color:#a76c7d;color:#ffd5de;background:#462a37}.card{padding:22px;border:1px solid var(--line);border-radius:14px;background:#122338;margin:16px 0}.login{max-width:520px;margin:45px auto}h2{font-size:23px;margin:0 0 10px}h3{font-size:16px;margin:20px 0 10px}.muted,small{color:var(--muted)}p{line-height:1.6}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.wide{width:100%;margin-top:18px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{border:1px solid var(--line);border-radius:11px;padding:17px;background:#14283e}.stat strong{display:block;font-size:27px}.stat span{font-size:12px;color:var(--muted)}.filters{display:grid;grid-template-columns:1fr 190px auto;gap:12px;align-items:end;margin:24px 0}.check{display:flex;gap:8px;align-items:center;min-height:44px}.check input{width:auto;min-height:0;margin:0}.room-heading h2{font-size:21px;margin:0}.badges{display:flex;gap:7px;flex-wrap:wrap}.badge{font-size:11px;font-weight:700;border:1px solid #4a6177;border-radius:20px;padding:5px 9px;color:#b9cbdc}.badge.open{color:#b3efd7;background:#1c493d;border-color:#57987d}.badge.closed{color:#f5d391;background:#473b27;border-color:#8b7445}.badge.revoked{color:#ffc5d1;background:#4c2d3a;border-color:#9c6378}.meta{font-size:12px;color:var(--muted);margin:10px 0}.numbers{display:flex;gap:22px;flex-wrap:wrap;font-size:13px;color:var(--muted);padding:14px 0;border-top:1px solid var(--line);margin-top:15px}.numbers strong{color:#eaf2fc}.details{border-top:1px solid var(--line);margin-top:20px;padding-top:5px}.code-row{padding:14px;border:1px solid var(--line);border-radius:9px;margin:10px 0;background:#0c1c2d}.code-row .actions{margin-top:10px}.code-row small{display:block;margin-top:5px}.revealed{display:block;margin-top:12px;font:12px ui-monospace,monospace;background:#172e43;padding:10px;overflow-wrap:anywhere}.notice{border:1px solid #4c8c78;background:#183e35;padding:14px 17px;border-radius:10px;margin:18px 0;line-height:1.6}.error{border-color:#a76c7d;background:#462a37;color:#ffdae3}.history-row{border-top:1px solid #30465c;padding:10px 0;font-size:13px}.history-row small{display:block}.empty{padding:35px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}dialog{background:#14283f;color:#eaf2fc;border:1px solid #536e88;border-radius:13px;padding:24px;width:min(480px,calc(100vw - 30px))}dialog::backdrop{background:#020815ba}dialog h2{font-size:21px}.footer-hint{font-size:12px;color:var(--muted)}@media(max-width:700px){header{padding:17px}header h1{font-size:19px}main{padding:20px 12px}.summary{grid-template-columns:repeat(2,1fr);gap:9px}.filters{grid-template-columns:1fr 1fr}.filters>label:first-child{grid-column:1/-1}.card{padding:17px}.room-heading{align-items:flex-start}.meta{line-height:1.7}.numbers{gap:13px}.actions button,.actions a{flex:1}.stat{padding:13px}.login{margin:20px auto}}
</style></head><body><header><div><h1>Rooms Admin</h1><p>Last Z SVS Planner · all rooms and access codes</p></div><a href="../">Open planner</a></header><main id="app"></main><script>
(()=>{'use strict';const API='https://acm1-shared-rooms.duskyfield128.chatgpt.site',app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let key='',rooms=[],loaded=false,busy=false,error='',notice='',query='',filter='all',revokedOnly=false,expanded=new Map(),revealed=new Map(),confirm=null,editor=null;const date=v=>v?new Date(v).toLocaleString():'—';function remember(){try{key?sessionStorage.setItem('lastz-room-admin-key',key):sessionStorage.removeItem('lastz-room-admin-key')}catch{}}async function api(path,method='GET',body){const res=await fetch(API+path,{method,headers:{Authorization:'Bearer '+key,...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let result;try{result=await res.json()}catch{throw Error('The admin service did not respond. Try again.')}if(!res.ok){if(res.status===401){loaded=false;key='';remember();}throw Error(result.error||'Admin request failed.');}return result;}
async function load(){rooms=[];let offset=0;do{const result=await api('/api/admin/rooms?offset='+offset);rooms.push(...result.rooms);offset=result.nextOffset;}while(offset!==null);loaded=true;remember();}function base(id){return '/api/admin/rooms/'+encodeURIComponent(id)}function feedback(){return `${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${error?`<div class="notice error" role="alert">${esc(error)}</div>`:''}`;}function ask(title,text,action,danger=false){confirm={title,text,action,danger};render();}async function perform(fn,message,id){busy=true;error='';notice='';render();try{await fn();expanded.clear();revealed.clear();await load();if(id)expanded.set(id,await api(base(id)));notice=message;}catch(e){error=e.message;}busy=false;render();}async function codeData(roomId,codeId){return (await api(base(roomId)+'/codes?codeId='+encodeURIComponent(codeId))).code;}function codeURL(c){return c.role==='member'?'https://uqcadams.github.io/acm1-planner/register/'+encodeURIComponent(/^[A-Z0-9]+(?:-[A-Z0-9]+)+$/i.test(c.label||'')&&(c.label||'').length<=40?c.label.toUpperCase():c.code):'https://uqcadams.github.io/acm1-planner/#room='+encodeURIComponent(c.code);}async function copy(value){try{await navigator.clipboard.writeText(value);notice='Copied to clipboard.';}catch{error='Clipboard access is unavailable. Use Reveal code and copy it manually.';}render();}
function detail(room){const d=expanded.get(room.id);if(!d)return '';return `<section class="details"><h3>Access codes · ${d.codes.length}</h3><p class="footer-hint">Revoked codes are retained here and cannot be used. Secrets are hidden until you reveal or copy them.</p>${d.codes.map(c=>`<div class="code-row"><div class="row between"><strong>${esc(c.label||c.role)}</strong><span class="badge ${c.revoked?'revoked':'open'}">${c.revoked?'Revoked':'Active'}</span></div><small>${esc(c.role)}${c.alliance?' · '+esc(c.alliance):''} · Created ${esc(date(c.created_at))}</small>${revealed.has(c.id)?`<code class="revealed">${esc(revealed.get(c.id))}</code>`:''}<div class="actions"><button data-action="reveal" data-room="${esc(room.id)}" data-code="${esc(c.id)}">${revealed.has(c.id)?'Hide code':'Reveal code'}</button><button data-action="copy-code" data-room="${esc(room.id)}" data-code="${esc(c.id)}">Copy code</button><button data-action="copy-link" data-room="${esc(room.id)}" data-code="${esc(c.id)}" ${c.revoked?'disabled':''}>Copy ${c.role==='member'?'registration':'planner'} link</button>${!c.revoked?`<button data-action="replace" data-room="${esc(room.id)}" data-code="${esc(c.id)}">${c.role==='member'?'Change code':'Regenerate code'}</button><button class="danger" data-action="revoke" data-room="${esc(room.id)}" data-code="${esc(c.id)}">Revoke</button>`:''}</div></div>`).join('')}<div class="actions"><button data-action="issue" data-room="${esc(room.id)}">Issue coordinator access</button><button class="danger" data-action="revoke-all" data-room="${esc(room.id)}" ${!room.activeCodes?'disabled':''}>Revoke all room codes</button></div><h3>Saved instances · ${d.archives.length}</h3>${d.archives.map(a=>`<div class="history-row"><strong>${esc(a.week_key)}</strong> · ${a.archived_at?'Archived':'Current'}<small>Version ${esc(a.version)} · Created ${esc(date(a.created_at))}${a.archived_at?' · Archived '+esc(date(a.archived_at)):''}</small></div>`).join('')}<h3>Admin history</h3>${d.events.length?d.events.map(e=>`<div class="history-row">${esc(e.changes.action)}<small>${esc(e.actor)} · ${esc(date(e.created_at))}</small></div>`).join(''):'<p class="muted">No admin actions recorded yet.</p>'}</section>`;}
function roomCards(list){return list.length?list.map(r=>`<article class="card"><div class="row between room-heading"><h2>${esc(r.name)}</h2><div class="badges"><span class="badge ${r.status}">${r.status==='open'?'Open':r.status==='closed'?'Closed':'Access revoked'}</span>${r.revokedCodes?`<span class="badge revoked">${r.revokedCodes} revoked code${r.revokedCodes===1?'':'s'}</span>`:''}</div></div><p class="meta">Created ${esc(date(r.createdAt))} · Current week ${esc(r.currentWeek)}${r.closedAt?' · Closed '+esc(date(r.closedAt)):''}</p><div class="badges">${r.features.registration?'<span class="badge">Registration enabled</span>':''}${r.features.weekly?'<span class="badge">Weekly rollover</span>':'<span class="badge">Continuous room</span>'}</div><div class="numbers"><span><strong>${r.placed}</strong> placed</span><span><strong>${r.waiting}</strong> waiting</span><span><strong>${r.responses}</strong> responses</span><span><strong>${r.activeCodes}</strong> active codes</span><span><strong>${r.archives}</strong> archives</span>${r.pending?`<span><strong>${r.pending}</strong> pending review</span>`:''}</div><div class="actions"><button data-action="details" data-room="${esc(r.id)}" aria-expanded="${expanded.has(r.id)}">${expanded.has(r.id)?'Hide details':'Codes & history'}</button><button data-action="planner" data-room="${esc(r.id)}">Open planner</button>${r.features.registration&&r.features.allianceAccess?`<button data-action="registration" data-room="${esc(r.id)}">Open registration</button><button data-action="registration-settings" data-room="${esc(r.id)}">Registration codes</button><button data-action="registration-map" data-room="${esc(r.id)}">Sync roster to map</button>`:''}<button data-action="duplicate" data-room="${esc(r.id)}">Duplicate room</button><button data-action="status" data-room="${esc(r.id)}" ${busy?'disabled':''}>${r.closed?'Reopen room':'Close room'}</button></div>${detail(r)}</article>`).join(''):'<div class="empty">No rooms match these filters.</div>';}
function rosterMapURL(c){return 'https://uqcadams.github.io/acm1-planner/#roster='+encodeURIComponent(decodeURIComponent(c.url.split('/register/')[1]));}
function editorMarkup(){if(!editor)return '';const r=rooms.find(r=>r.id===editor.id),c=editor.code;let body='';if(editor.type==='registration'){body=`<h2 id="editor-title">Registration · ${esc(r.name)}</h2><p class="muted">Open the member page or replace its access code. Changing a code disables its previous link; roster responses stay saved.</p>${editor.codes.length?editor.codes.map(c=>`<div class="code-row"><strong>${esc(c.alliance||'Members')}</strong><small>${esc(c.label)}</small><div class="actions"><a class="button" href="${esc(c.url)}">Open registration</a><a class="button" href="${esc(rosterMapURL(c))}">Sync roster to map</a><button type="button" data-edit-code="${esc(c.id)}">Change code</button></div></div>`).join(''):'<p>No active member registration codes.</p>'}<h3>Add registration access</h3><form id="editor-form"><label>Alliance<input id="edit-alliance" required maxlength="40" value="${esc(editor.alliance||'')}" placeholder="ACM1"></label><label>Registration code<input id="edit-value" required minlength="4" maxlength="40" value="${esc(editor.value||'')}" placeholder="ACM1-NOV07" autocapitalize="characters" spellcheck="false" pattern="[A-Za-z0-9]+(-[A-Za-z0-9]+)+"></label><div class="actions"><button class="primary" ${busy?'disabled':''}>Create registration code</button><button type="button" data-editor-cancel ${busy?'disabled':''}>Close</button></div></form>`;}else if(editor.type==='duplicate'){body=`<h2 id="editor-title">Duplicate room</h2><p>Copies the roster, placements, boundaries and settings into a new open room. All access codes are new. Registration responses, archives and edit history stay with the original.</p><form id="editor-form"><label>New room name<input id="edit-value" required maxlength="80" value="${esc(editor.value)}"></label><div class="actions"><button class="primary" ${busy?'disabled':''}>${busy?'Duplicating…':'Duplicate room'}</button><button type="button" data-editor-cancel ${busy?'disabled':''}>Cancel</button></div></form>`;}else{body=`<h2 id="editor-title">${c.role==='member'?'Change registration code':'Regenerate access code'}</h2><p>The old code will be revoked. Existing roster, placements and responses are retained.</p><form id="editor-form">${c.role==='member'?`<label>New registration code<input id="edit-value" maxlength="40" value="${esc(editor.value||'')}" placeholder="ACM1-NOV07" autocapitalize="characters" spellcheck="false" pattern="[A-Za-z0-9]+(-[A-Za-z0-9]+)+"></label><p class="footer-hint">Leave blank to generate a unique code. Previously used codes cannot be reused.</p>`:''}<div class="actions"><button class="primary" ${busy?'disabled':''}>${busy?'Updating…':'Replace code'}</button><button type="button" data-editor-cancel ${busy?'disabled':''}>Cancel</button></div></form>`;}return `<dialog id="editor" aria-labelledby="editor-title">${body}${error?`<div class="notice error" role="alert">${esc(error)}</div>`:''}</dialog>`;}
function bindEditor(){if(!editor)return;const dialog=document.getElementById('editor');dialog.showModal();const cancel=()=>{if(!busy){editor=null;error='';render();}};dialog.oncancel=e=>{e.preventDefault();cancel();};dialog.querySelectorAll('[data-editor-cancel]').forEach(b=>b.onclick=cancel);dialog.querySelectorAll('[data-edit-code]').forEach(b=>b.onclick=()=>{const code=editor.codes.find(c=>c.id===b.dataset.editCode);editor={type:'replace',id:editor.id,code:{...code,role:'member'},value:''};render();});const input=document.getElementById('edit-value'),alliance=document.getElementById('edit-alliance');if(input){input.oninput=e=>editor.value=e.target.value;if(!busy){input.focus();input.select();}}if(alliance)alliance.oninput=e=>editor.alliance=e.target.value;document.getElementById('editor-form').onsubmit=async e=>{e.preventDefault();if(busy)return;const current=editor;busy=true;error='';render();try{let result;if(current.type==='duplicate')result=await api(base(current.id)+'/duplicate','POST',{name:current.value});else if(current.type==='registration')await api(base(current.id)+'/codes','POST',{role:'member',alliance:current.alliance,label:current.value});else await api(base(current.id)+'/codes','PATCH',{codeId:current.code.id,code:current.value||''});await load();expanded.clear();revealed.clear();const id=result?.id||current.id;expanded.set(id,await api(base(id)));editor=null;notice=current.type==='duplicate'?'Room duplicated with fresh access codes.':current.type==='registration'?'Registration code created.':'Code replaced. Previous links using that code no longer work.';}catch(e){error=e.message;}busy=false;render();};}
function bindActions(){app.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{if(busy)return;const id=el.dataset.room,action=el.dataset.action,r=rooms.find(r=>r.id===id);error='';notice='';if(action==='duplicate'){editor={type:'duplicate',id,value:(r.name+' · Copy').slice(0,80)};render();return;}if(action==='replace'){const c=expanded.get(id)?.codes.find(c=>c.id===el.dataset.code);editor={type:'replace',id,code:c,value:''};render();return;}if(action==='registration'||action==='registration-settings'||action==='registration-map'){busy=true;render();try{const result=await api(base(id)+'/registration');if((action==='registration'||action==='registration-map')&&result.codes.length===1){location.assign(action==='registration'?result.codes[0].url:rosterMapURL(result.codes[0]));return;}editor={type:'registration',id,codes:result.codes,alliance:'',value:''};}catch(e){error=e.message;}busy=false;render();return;}if(action==='status'){ask(r.closed?'Reopen '+r.name+'?':'Close '+r.name+'?',r.closed?'Existing active codes will be able to edit the room again.':'The room remains available read-only. All HQs, roster responses and history are retained. You can reopen it later.',()=>perform(()=>api(base(id)+'/status','PATCH',{status:r.closed?'open':'closed'}),r.closed?'Room reopened.':'Room closed; data retained.',id));return;}if(action==='revoke'||action==='revoke-all'){ask(action==='revoke'?'Revoke this access code?':'Revoke every code for '+r.name+'?', 'Revoked codes and their history remain listed. Existing links using these codes will stop working. Revocation is permanent; replacement codes can be issued.',()=>perform(()=>api(base(id)+'/revoke','POST',action==='revoke'?{codeId:el.dataset.code}:{all:true}),'Access revoked.',id),true);return;}if(action==='issue'){ask('Issue coordinator access?', 'This creates a new coordinator code with full editing access to this room. Existing revoked codes remain revoked.',()=>perform(()=>api(base(id)+'/codes','POST',{role:'coordinator',label:'Replacement coordinator'}),'Coordinator access issued. Reveal or copy it below.',id));return;}busy=true;render();try{if(action==='details'){if(expanded.has(id))expanded.delete(id);else expanded.set(id,await api(base(id)));}else if(action==='planner'){const result=await api(base(id)+'/planner');location.assign(result.url);return;}else{const c=await codeData(id,el.dataset.code);if(action==='reveal'){revealed.has(c.id)?revealed.delete(c.id):revealed.set(c.id,c.code);}else if(action==='copy-code')await copy(c.code);else if(action==='copy-link')await copy(codeURL(c));}}catch(e){error=e.message;}busy=false;render();});}
function render(){if(!loaded){app.innerHTML=`<section class="card login"><h2>Manage every room</h2><p class="muted">Sign in with your site-admin key to view open and closed rooms, archives and revoked access codes.</p><form id="login"><label>Site-admin key<input id="key" type="password" autocomplete="current-password" required placeholder="ADMIN-…"></label><button class="primary wide" ${busy?'disabled':''}>${busy?'Opening dashboard…':'Unlock dashboard'}</button></form>${feedback()}<p class="footer-hint">Room coordinator, officer and member codes cannot unlock this dashboard.</p></section>`;document.getElementById('login').onsubmit=async e=>{e.preventDefault();key=document.getElementById('key').value.trim();busy=true;error='';render();try{await load();}catch(e){error=e.message;}busy=false;render();};return;}const total=rooms.length,open=rooms.filter(r=>r.status==='open').length,closed=rooms.filter(r=>r.status==='closed').length,revoked=rooms.reduce((n,r)=>n+r.revokedCodes,0);app.innerHTML=`<div class="row between"><div><h2>All rooms</h2><p class="muted">Closed rooms and revoked codes stay here for review.</p></div><div class="row"><button id="refresh" ${busy?'disabled':''}>Refresh</button><button id="logout">Lock dashboard</button></div></div><div class="summary"><div class="stat"><strong>${total}</strong><span>Total rooms</span></div><div class="stat"><strong>${open}</strong><span>Open rooms</span></div><div class="stat"><strong>${closed}</strong><span>Closed rooms</span></div><div class="stat"><strong>${revoked}</strong><span>Revoked codes</span></div></div>${feedback()}<div class="filters"><label>Find a room<input id="query" type="search" placeholder="Room name…" value="${esc(query)}"></label><label>Room status<select id="filter">${[['all','All rooms'],['open','Open'],['closed','Closed'],['revoked','Access revoked']].map(([v,label])=>`<option value="${v}" ${filter===v?'selected':''}>${label}</option>`).join('')}</select></label><label class="check"><input id="revoked" type="checkbox" ${revokedOnly?'checked':''}>With revoked codes</label></div><div id="rooms"></div><p class="footer-hint">Closing a room pauses edits. Revoking a code stops that code’s access. Neither action deletes the room or its records.</p>${confirm?`<dialog id="confirm" aria-labelledby="confirm-title"><h2 id="confirm-title">${esc(confirm.title)}</h2><p>${esc(confirm.text)}</p><div class="actions"><button id="cancel">Cancel</button><button id="proceed" class="${confirm.danger?'danger':'primary'}">${confirm.danger?'Revoke access':'Confirm'}</button></div></dialog>`:''}${editorMarkup()}`;
const update=()=>{document.getElementById('rooms').innerHTML=roomCards(rooms.filter(r=>(!query||r.name.toLocaleLowerCase().includes(query.toLocaleLowerCase()))&&(filter==='all'||r.status===filter)&&(!revokedOnly||r.revokedCodes>0)));bindActions();};update();bindEditor();document.getElementById('query').oninput=e=>{query=e.target.value;update();};document.getElementById('filter').onchange=e=>{filter=e.target.value;update();};document.getElementById('revoked').onchange=e=>{revokedOnly=e.target.checked;update();};document.getElementById('refresh').onclick=()=>perform(async()=>{},'Room list refreshed.');document.getElementById('logout').onclick=()=>{key='';loaded=false;rooms=[];expanded.clear();revealed.clear();remember();notice='';error='';render();};if(confirm){const d=document.getElementById('confirm');d.showModal();const cancel=()=>{confirm=null;render();};d.oncancel=e=>{e.preventDefault();cancel();};document.getElementById('cancel').onclick=cancel;document.getElementById('proceed').onclick=()=>{const action=confirm.action;confirm=null;action();};}}
async function boot(){try{key=sessionStorage.getItem('lastz-room-admin-key')||'';}catch{}if(key){busy=true;render();try{await load();}catch(e){error=e.message;}busy=false;}render();}boot();})();
</script></body></html>
