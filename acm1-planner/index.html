/* Player/alliance colour controls and single-cell exclusion management */
.colour-choices{display:flex;align-items:center;flex-wrap:wrap;gap:7px;margin-top:7px}
.colour-chip{width:24px;height:24px;border-radius:7px;border:2px solid rgba(245,250,255,.25);padding:0;transition:transform .12s ease,border-color .12s ease;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.colour-chip:hover{transform:translateY(-2px)}
.colour-chip.chosen{border-color:#fff;outline:2px solid #8ba8ff;outline-offset:1px}
.custom-colour{display:flex;gap:5px;align-items:center;margin-left:4px;font-size:10px;color:#a2b7cc;cursor:pointer}
.custom-colour input{width:28px;height:24px;border:1px solid #485a73;background:transparent;padding:0;border-radius:6px;cursor:pointer}
.smallbutton.exclusion-active{background:#a63745;border-color:#ee7784;color:#fff}
.excluded-row{display:flex;align-items:center;gap:6px;padding:7px 0;border-bottom:1px solid #26364a}
.excluded-row .mini-code{flex:1}
.excluded-row .smallbutton{padding:6px 8px}
.excluded-row .delete{border-color:#85434a;color:#ffb2b7}
.excluded-cell-glyph{font-weight:900;color:#ff8691;background:#4b232b;width:25px;height:25px;line-height:24px;text-align:center;border-radius:5px}
.small-meta{font-size:10px;color:#9db1c7;margin-top:8px;line-height:1.5}
.tabrow .tab{min-width:0;padding:13px 0;font-size:10px}
@media(max-width:900px){.colour-chip{width:28px;height:28px}}

/* v1.3 Responsive, touch-first map controls */
.mobile-nav,.mobile-tip{display:none}
@media (max-width: 800px), (pointer: coarse) and (max-width: 1100px){
  html,body,#root{height:100%;width:100%;overscroll-behavior:none}
  .app{height:100vh;height:100dvh;min-height:0;max-height:100dvh;overflow:hidden}
  .shell{display:block;position:relative;min-height:0;flex:1;overflow:hidden}
  .mapwrap{position:absolute;inset:0;min-width:0;min-height:0}
  .left,.right{display:none!important;position:absolute;left:0;right:0;bottom:0;top:auto;width:100%;max-height:67%;z-index:12;overflow-y:auto;overscroll-behavior:contain;border:1px solid #334b62;border-bottom:0;border-radius:18px 18px 0 0;box-shadow:0 -12px 42px #000a;background:#0c1624}
  .left.mobile-show,.right.mobile-show{display:block!important}
  .left .section,.right .detail{padding:14px 18px}
  .left .side-header,.right .side-header{padding:14px 18px 12px}
  .left .section:last-child{grid-column:auto}
  .topbar{height:54px;min-height:54px;padding:0 12px}
  .topstatus .pill{display:none}
  .brand{min-width:0;gap:8px}
  .brand-mark{width:31px;height:31px;flex-shrink:0}
  .brand-title{font-size:12px;letter-spacing:.035em}
  .brand-sub{font-size:9px;letter-spacing:.07em}
  .top-action{padding:9px 10px;min-height:38px;font-size:11px}
  .map-heading{display:none}
  .maplegend{display:none}
  .footer{display:none}
  .map-tools{right:10px;top:10px;gap:7px}
  .map-tools button{width:44px;height:44px;font-size:21px;touch-action:manipulation}
  .map-tools button.fit{min-width:48px;font-size:12px}
  .coordcard{left:10px;bottom:10px;min-width:0;padding:9px 12px;pointer-events:none}
  .coordval{font-size:17px}
  .coordcard .subtle{font-size:10px}
  .mobile-nav{display:flex;flex-shrink:0;align-items:stretch;justify-content:space-around;height:calc(70px + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px);background:#0b1725;border-top:1px solid #32485f;z-index:20}
  .mobile-tab{flex:1;min-width:0;padding:5px 2px;border:0;background:transparent;color:#92a9c4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:700;font-size:10px;touch-action:manipulation}
  .mobile-tab.active{color:#70ecc1;background:#18352f}
  .mobile-tab.block.active{background:#472730;color:#ffadb5}
  .mobile-tab .mobile-glyph{font-size:22px;line-height:25px}
  .mobile-tip{display:block;position:absolute;top:65px;left:50%;transform:translateX(-50%);background:#0a1828dc;border:1px solid #32495a;padding:6px 11px;border-radius:24px;font-size:10px;color:#c3d5e7;white-space:nowrap;pointer-events:none;z-index:3}
  .mobile-move.active{background:#24574c;border-color:#66debd;color:#d5fff0}
  input, select{font-size:16px!important}
  .smallbutton,.widebutton{min-height:43px;font-size:12px}
  .tab{min-height:46px;font-size:12px}
}
@media (max-width: 420px){
  .topstatus .top-action:first-of-type{display:none}
  .brand-sub{display:none}
  .mobile-tab{font-size:9px}
  .coordcard{padding:6px 8px}
  .coordval{font-size:15px}
  .mobile-tip{top:61px}
}

/* UTF-8 in-game coordinate exports: mobile-friendly controls */
.coordinate-preview{margin-top:12px;width:100%;min-height:96px;max-height:265px;resize:vertical;white-space:pre;overflow:auto;background:#071423;border:1px solid #354b61;border-radius:9px;padding:12px;font:12px/1.75 ui-monospace,SFMono-Regular,Consolas,monospace;color:#d5f8e7;-webkit-overflow-scrolling:touch;direction:ltr;}
.coordinate-preview:focus{outline:2px solid #69ddb2;outline-offset:1px;}
.coordinate-player-row{padding:12px 0;border-bottom:1px solid #283a4c;display:flex;flex-wrap:wrap;align-items:center;gap:8px;}
.coordinate-player-main{flex:1 1 125px;min-width:0;}
.coordinate-player-main .mini-code{margin-top:5px;font-size:10px;color:#8db4c9;}
.coordinate-player-actions{display:flex;gap:7px;margin-left:auto;}
.coordinate-player-actions .smallbutton{min-height:38px;padding:8px 11px;}
.coordinate-selected-line{padding:10px 0;line-height:1.7;}
@media(max-width:800px){.coordinate-player-actions .smallbutton,.detail .btnrow .smallbutton{min-height:43px;}.coordinate-preview{font-size:13px;}.tabrow .tab{font-size:10px;}}


/* Coordinate labels, player lock/anchor actions, and deliberate full reset */
.map-tools .coords-toggle{font-size:10px;min-width:75px;padding:0 8px;white-space:nowrap}
.map-tools .coords-toggle.active{background:#225449;color:#b5ffe3;border-color:#64dfb0}
.unit-name-controls{display:flex;align-items:center;gap:4px;min-width:0}
.unit-name-controls .unit-name{flex:1;min-width:0}
.unit-mini-button{border:1px solid #364e65;background:#14273a;border-radius:6px;flex:0 0 24px;width:24px;height:26px;display:grid;place-items:center;font-size:12px;color:#bbd0e5;padding:0;line-height:1}
.unit-mini-button[aria-pressed="true"]{border-color:#e9bc68;background:#483920;color:#ffe4a4}
.unit-mini-button.locked{color:#b7caff}
.unit-mini-button:focus-visible,.danger-reset:focus-visible{outline:2px solid #92f3ce;outline-offset:2px}
.unit-mini-button:hover{border-color:#69ddbc;background:#204138}
.danger-reset{border-color:#9b4958!important;color:#ffc8cd!important;background:#37212c!important;font-weight:800}
.danger-reset:hover{background:#552633!important;border-color:#ed778a!important}
.map-zoom-hint{position:absolute;top:68px;right:12px;background:#0b1b2cec;border:1px solid #385367;color:#d5e3f6;border-radius:8px;padding:8px 11px;font-size:11px;pointer-events:none;z-index:2}
@media(max-width:800px){.topbar .danger-reset{display:none}.unit-mini-button{width:32px;height:34px;flex-basis:32px;font-size:14px}.map-tools .coords-toggle{min-width:62px;font-size:10px;padding:0 5px}.map-tools button{height:40px;min-width:36px}}


/* Headquarters cards: names, metadata and actions each have their own space. */
.unit{display:flex;flex-direction:column;align-items:stretch;gap:10px;min-width:0;padding:12px}
.unit-heading{display:flex;align-items:flex-start;gap:10px;width:100%;min-width:0;padding:0;border:0;background:transparent;color:inherit;text-align:left;cursor:pointer}
.unit-details{display:block;min-width:0}
.unit-alliance{display:block;margin-bottom:3px;font-size:10px;letter-spacing:.06em;color:#9eb6ce;overflow-wrap:anywhere}
.unit-name{display:block;font-size:13px;line-height:1.45;font-weight:780;white-space:normal;overflow:visible;text-overflow:clip;overflow-wrap:anywhere;unicode-bidi:plaintext}
.unit-meta{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 10px}
.unit-coords{margin:0;font-size:11px;line-height:1.5;white-space:nowrap}
.unit-status{font-size:10px;line-height:1.5}
.unit-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;padding-top:10px;border-top:1px solid #314459}
.unit-action{min-width:0;min-height:36px;padding:7px 4px;border:1px solid #364e65;border-radius:6px;background:#14273a;color:#bbd0e5;font-size:11px;font-weight:700;line-height:1.4;overflow-wrap:anywhere;touch-action:manipulation}
.unit-action[aria-pressed="true"]{border-color:#bb9756;background:#3b3223;color:#ffe4a4}
.unit-action:hover{border-color:#69ddbc}
.unit-heading:focus-visible,.unit-action:focus-visible{outline:2px solid #92f3ce;outline-offset:3px;border-radius:6px}
@media(max-width:800px),(pointer:coarse) and (max-width:1100px){.unit-action{min-height:44px;font-size:12px}}

.hq-menu-shade{position:fixed;inset:0;z-index:50;background:#0002}
.hq-menu{position:fixed;z-index:51;width:min(270px,calc(100vw - 16px));max-height:calc(100dvh - 16px);overflow:auto;padding:8px;background:#101e30;border:1px solid #53718c;border-radius:10px;box-shadow:0 12px 40px #0009}
.hq-menu-title{padding:8px 9px 10px;border-bottom:1px solid #314459;overflow-wrap:anywhere;font-size:13px;font-weight:800}
.hq-menu button{display:block;width:100%;min-height:40px;text-align:left;border:0;border-radius:6px;padding:10px;background:transparent;color:#eaf2fc;font-size:12px}
.hq-menu button:hover,.hq-menu button:focus-visible{background:#25483f;outline:2px solid #72e6bc;outline-offset:-2px}
.hq-menu .field{margin-top:8px}.hq-menu small{display:block;color:#a2b7cc;font-size:10px;margin-top:5px;font-weight:400}
.unit-more{width:100%;min-height:32px;border:1px solid #364e65;border-radius:6px;background:#14273a;color:#bbd0e5;font-size:11px}
