const deploymentInspectorStates=new Map();
function inspectorKey(map){return data.room.id+'|'+data.instance.week+'|'+map.alliance;}
function mapGestureActive(){return [...deploymentInspectorStates.values()].some(s=>s.pointers?.size);}

function inspectorDetail(map,id){const m=(map.assignments||[]).find(m=>m.memberId===id&&Number.isInteger(m.x)&&Number.isInteger(m.y));if(!m)return '<p class="inspector-empty">Select an HQ to see the player and coordinates.</p>';return `<div class="inspector-identity"><strong>${esc(m.name)}</strong><span>HQ ${esc(m.level??'—')} · ${esc(m.alliance||map.alliance)}</span><span class="status-chip ${m.status==='updated'?'deployment-updated':'available'}">${m.status==='updated'?'Deployment Updated':'Deployed'}</span></div><div class="inspector-position"><strong>X: ${m.x} · Y: ${m.y}</strong><button type="button" data-copy-member="${esc(m.memberId)}" aria-label="Copy inspected coordinates for ${esc(m.name)}">Copy coordinates</button></div>`;}

function bindMapInspectors(){app.querySelectorAll('[data-inspector]').forEach(shell=>{const map=(data.deploymentMaps||[]).find(m=>inspectorKey(m)===shell.dataset.inspector),svg=shell.querySelector('svg');if(!map||!svg){shell.querySelectorAll('[data-map-zoom],[data-map-fit]').forEach(b=>b.disabled=true);return;}const key=shell.dataset.inspector,values=svg.getAttribute('viewBox').split(/\s+/).map(Number),base={x:values[0],y:values[1],width:values[2],height:values[3]};let state=deploymentInspectorStates.get(key);if(!state)state={base,view:{...base},zoom:1,selected:null,pointers:new Map()};else{state.pointers=new Map();state.base=base;if(state.zoom<=1.00001)state.view={...base};else state.zoom=Math.max(1,Math.min(20,base.width/state.view.width));inspectorClamp(state);}deploymentInspectorStates.set(key,state);svg.setAttribute('role','group');svg.setAttribute('tabindex','0');svg.setAttribute('aria-label',map.alliance+' deployment inspector. Scroll or use plus and minus to zoom. Select an HQ for details.');const draw=()=>{const v=state.view;svg.setAttribute('viewBox',[v.x,v.y,v.width,v.height].join(' '));shell.querySelector('.inspector-zoom').textContent=Math.round(state.zoom*100)+'%';shell.querySelector('[data-map-zoom="out"]').disabled=state.zoom<=1;shell.querySelector('[data-map-zoom="in"]').disabled=state.zoom>=20;svg.querySelectorAll('[data-hq]').forEach(el=>el.classList.toggle('inspected-hq',el.dataset.hq===state.selected));};const world=(x,y)=>{const matrix=svg.getScreenCTM();if(!matrix)return {x:state.view.x+state.view.width/2,y:state.view.y+state.view.height/2};const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(matrix.inverse());};const select=id=>{state.selected=id;shell.querySelector('.inspector-details').innerHTML=inspectorDetail(map,id);bindDeploymentCopies(shell.querySelector('.inspector-details'));draw();};const zoom=(factor,client)=>{const anchor=client?world(client.x,client.y):{x:state.view.x+state.view.width/2,y:state.view.y+state.view.heig function deploymentMapMarkup(){const maps=data.deploymentMaps||[];return `<section class="card deployment-map-card" aria-label="Alliance deployment map"><div class="topline"><h2>Your alliance deployment</h2><span id="map-live-status" class="map-live-status" role="status">Live · refreshes every 10s</span></div><p class="muted">Your territory and assigned HQ positions. Orange status means a previously assigned position changed. Copy your latest coordinates before moving.</p>${maps.length?maps.map(m=>`<div class="deployment-alliance"><h3>${esc(m.alliance)} <small>${(m.assignments||[]).filter(a=>a.x!==null).length} assigned</small></h3>${inspectorShell(m)}<small>Updated ${esc(new Date(m.updatedAt).toLocaleString())}</small></div>`).join(''):'<p class="muted">Waiting for your leader to publish deployments.</p>'}<p class="footer-note">Positions are planning instructions; the planner does not move your HQ in-game. Registration and deployment updates are saved separately.</p></section>`;}
let registrationRefreshing=false;async function refreshRegistrationLive(){if(!data||!code||document.hidden||saving.size||addBusy||note||adding||registrationRefreshing||mapGestureActive())return;const currentCode=code;registrationRefreshing=true;try{const next=await api('/api/registration/state');if(code!==currentCode||mapGestureActive()||saving.size||addBusy||note||adding||['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))return;const previous=data;data=next;if(JSON.stringify(previous)!==JSON.stringify(next)){const active=document.activeElement,action=active?.dataset.action,id=active?.dataset.id;render();if(action&&id)app.querySelector(`[data-action="${action}"][data-id="${CSS.escape(id)}"]`)?.focus();}else{const badge=document.getElementById('map-live-status');if(badge)badge.textContent='Live · checked '+new Date().toLocaleTimeString();}}catch(e){const badge=document.getElementById('map-live-status');if(badge)badge.textContent='Not live · '+e.message;}finally{registrationRefreshing=false;}}
if(typeof setInterval==='function')setInterval(refreshRegistrationLive,10000);document.addEventListener?.('visibilitychange',()=>{if(!document.hidden)refreshRegistrationLive();});

function rows(members){return members.length?members.map(m=>{const r=baseRegistration(m.id),busy=saving.has(m.id);return `<article class="member-row ${highlight===m.id?'highlight':''}" data-member="${esc(m.id)}" aria-label="${esc(m.name)} registration"><div class="member-heading"><div class="identity"><strong>${esc(m.name)}</strong><span class="hq">HQ ${esc(m.level||'—')}</span></div><div class="member-status">${statusMarkup(r)}${deploymentMarkup(m)}${m.rosterStatus==='pending'?'<span class="pending-badge">Pending review</span>':''}<span class="save-status" role="status">${busy?icon('clock')+'Saving…':saved.has(m.id)?icon('check')+'Saved':''}</span></div></div>${controls(m.id,m.name,r,busy||readOnly())}</article>`}).join(''):'<p class="empty">No matching members. Add yourself below.</p>';}
function bindControls(root=app){bindDeploymentCopies(root);root.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{const id=el.dataset.id,action=el.dataset.action,isAdd=id==='new-member',r=isAdd?addDraft:baseRegistration(id);if(action==='note'){note={id,name:isAdd?'New member':data.members.find(m=>m.id===id)?.name||'Member',text:r.notes||'',busy:false,error:''};render();return;}const patch=['before','during','unavailable'].includes(action)?availabilityPatch(r,action):{placement:action};if(isAdd){Object.assign(addDraft,patch);render();return;}await saveRow(id,patch,action);});}

async function saveRow(id,patch,focusAction){if(saving.has(id)||readOnly())return false;const member=data.members.find(m=>m.id===id);if(!member)return false;saving.add(id);saved.delete(id);error='';notice='';render();try{const r=await api('/api/register','PUT',{...registrationBody(baseRegistration(id),patch),week:data.instance.week,actor:member.name});data.registrations=data.registrations.filter(q=>q.memberId!==id).concat(r);saved.add(id);saving.delete(id);render();if(focusAction)app.querySelector(`[data-action="${focusAction}"][data-id="${CSS.escape(id)}"]`)?.focus();return true;}catch(e){saving.delete(id);error=e.message;render();return false;}}
function render(){if(!data){app.innerHTML=`<section class="card join"><p class="eyebrow">Capital Clash · weekly check-in</p><h2>Open your alliance roster</h2><p>Enter the code from your alliance leader to set your availability and terrain preference.</p><form id="join"><label>Alliance access code<input id="code" autocomplete="off" required placeholder="ACM1-OCT31" value="${esc(code)}"></label><button class="primary wide" ${joining?'disabled':''}>${joining?'Opening roster…':'Open alliance roster'}</button></form>${message()}<p class="footer-note">No account required. Anyone with the code can update this alliance’s responses.</p></section>`;document.getElementById('join').onsubmit=async e=>{e.preventDefault();code=document.getElementById('code').value.trim();joining=true;error='';render();try{data=await api('/api/registration/join','POST',{code});rememberCode(code);history.replaceState(null,'',/^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+$/.test(code)?'/acm1-planner/register/'+encodeURIComponent(code.toUpperCase()):'/acm1-planner/register/');notice='';}catch(e){error=e.message;}joining=false;render();};return;}
const members=data.members.filter(m=>!query||(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())),confirmed=data.members.filter(m=>data.registrations.find(r=>r.memberId===m.id)?.status==='available').length;
app.innerHTML=`<section class="card"><div class="topline"><div><p class="eyebrow">${esc(data.access.alliance||data.room.name)}</p><h2>Your weekly check-in</h2></div><button id="leave">Change code</button></div><p class="muted">Find your name, select your availability and terrain. Changes save automatically.</p><details><summary>Event times · week of ${esc(data.instance.week)}</summary><p>Before Clash: Saturday 00:00–12:00 APOC. During Clash: Saturday 12:00–16:00 APOC (UTC−2). Your local time — Before: ${esc(localTime(0))} → ${esc(localTime(12))}; During: ${esc(localTime(12))} → ${esc(localTime(16))}. Add any limitations in your note. Previously saved custom hours and roles are preserved.</p></details></section>${data.instance.closed?'<div class="notice" role="status">This room is closed. Registration is available read-only.</div>':''}${message()}${deploymentMapMarkup()}<section class="card"><div class="topline"><h2>Alliance roster <span class="count">${confirmed} available / ${data.members.length} members</span></h2><button id="add-link">+ Missing member</button></div><label class="search">Find your name<input type="search" id="search" placeholder="Search players…" value="${esc(query)}"></label><div class="roster-head"><span>Name</span><span>HQ</span><span>Terrain · confirmation · note</span></div><div id="member-list">${rows(members)}</div><p class="footer-note">You can select both periods. Unavailable clears both. Add a note for any exceptions.</p>${adding?`<section class="add-box" id="add-box"><h3>Add a missing member</h3><form id="enroll" class="add-row"><label><span class="muted">Name</span><input name="name" aria-label="New member name" maxlength="120" autocomplete="off" value="${esc(addDraft.name)}" required ${addBusy?'disabled':''}></label><label><span class="muted">HQ</span><input name="level" aria-label="New member HQ level" type="number" min="1" max="99" value="${esc(addDraft.level)}" required ${addBusy?'disabled':''}></label>${!data.access.alliance?`<label><span class="muted">Alliance</span><input name="alliance" aria-label="New member alliance" maxlength="120" value="${esc(addDraft.alliance)}" required ${addBusy?'disabled':''}></label>`:''}${controls('new-member','new member',addDraft,addBusy||readOnly(),true)}<button class="primary add-submit" ${addBusy||readOnly()?'disabled':''}>${addBusy?'Saving…':addDraft.memberId?'Save registration':'Add member'}</button></form><p class="footer-note">New entries need officer approval before automatic deployment.</p></section>`:''}</section>${note?`<dialog id="note-dialog" aria-labelledby="note-title"><form id="note-form"><h2 id="note-title">Note · ${esc(note.name)}</h2><label>Optional note<textarea id="note-text" rows="5" maxlength="1500" placeholder="Availability limits, preferred role, or anything your officers should know…" ${note.busy?'disabled':''}>${esc(note.text)}</textarea></label>${note.error?`<p class="notice error" role="alert">${esc(note.error)}</p>`:''}<div class="actions"><button type="button" id="note-cancel" ${note.busy?'disabled':''}>Cancel</button><button class="primary" ${note.busy?'disabled':''}>${note.busy?'Saving…':'Save note'}</button></div></form></dialog>`:''}`;
bindMapInspectors();document.getElementById('leave').onclick=()=>{if(saving.size||addBusy)return;data=null;code='';note=null;rememberCode('');history.replaceState(null,'','/acm1-planner/register/');notice='';error='';render();};document.getElementById('refresh')?.addEventListener('click',async()=>{try{data=await api('/api/registration/state');error='';notice='Latest responses loaded. Please retry your change.';}catch(e){error=e.message;}render();});const search=document.getElementById('search');search.oninput=()=>{query=search.value;document.getElementById('member-list').innerHTML=rows(data.members.filter(m=>(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())));bindControls(document.getElementById('member-list'));};document.getElementById('add-link').onclick=()=>{adding=true;if(!addDraft.name)addDraft.name=query;if(!data.access.alliance&&!addDraft.alliance){const tags=[...new Set(data.members.map(m=>m.alliance).filter(Boolean))];if(tags.length===1)addDraft.alliance=tags[0];}render();document.querySelector('input[name="name"]')?.focus();document.getElementById('add-box')?.scrollIntoView({block:'nearest',behavior:'smooth'});};bindControls();const form=document.getElementById('enroll');if(form){form.elements.name.oninput=e=>addDraft.name=e.target.value;form.elements.level.oninput=e=>addDraft.level=e.target.value;if(form.elements.alliance)form.elements.alliance.oninput=e=>addDraft.alliance=e.target.value;form.onsubmit=async e=>{e.preventDefault();if(addBusy||readOnly())return;addBusy=true;error='';notice='';render();try{if(!addDraft.memberId){const result=await api('/api/registration/members','POST',{name:addDraft.name,level:Number(addDraft.level),alliance:addDraft.alliance||data.access.alliance,week:data.instance.week,actor:addDraft.name});data=result.state;if(result.existing){highlight=result.memberId;throw Error('This member is already on the roster. Use their existing row above.');}addDraft.memberId=result.memberId;}const id=addDraft.memberId,r=await api('/api/register','PUT',{...registrationBody(baseRegistration(id),{status:addDraft.status,windows:addDraft.windows,placement:addDraft.placement,notes:addDraft.notes}),week:data.instance.week,actor:addDraft.name});data.registrations=data.registrations.filter(q=>q.memberId!==id).concat(r);saved.add(id);highlight=id;notice=addDraft.name+' added with their preferences. Pending officer approval.';addDraft={name:'',level:'',placement:'grass',status:'unanswered',windows:[],notes:'',memberId:null,alliance:''};adding=false;query='';}catch(e){error=e.message;}addBusy=false;render();};}
if(note){const dialog=document.getElementById('note-dialog');dialog.showModal();const input=document.getElementById('note-text');input.oninput=()=>note.text=input.value;if(!note.busy)input.focus();const close=()=>{if(note.busy)return;const id=note.id;note=null;render();app.querySelector(`[data-action="note"][data-id="${CSS.escape(id)}"]`)?.focus();};dialog.oncancel=e=>{e.preventDefault();close();};document.getElementById('note-cancel').onclick=close;document.getElementById('note-form').onsubmit=async e=>{e.preventDefault();if(note.busy)return;const current=note;if(current.id==='new-member'){addDraft.notes=current.text;close();return;}current.busy=true;render();const ok=await saveRow(current.id,{notes:current.text});if(ok){current.busy=false;close();}else{current.busy=false;current.error=error;render();}};}}
async function boot(){try{const params=new URLSearchParams(location.search),pathCode=location.pathname.match(/^\/acm1-planner\/register\/([A-Za-z0-9-]+)\/?$/)?.[1];code=pathCode||params.get('code')||new URLSearchParams(location.hash.slice(1)).get('code')||storedCode();if(code){joining=true;render();data=await api('/api/registration/join','POST',{code});rememberCode(code);history.replaceState(null,'',/^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+$/.test(code)?'/acm1-planner/register/'+encodeURIComponent(code.toUpperCase()):'/acm1-planner/register/');}}catch(e){error=e.message;}joining=false;render();}
window.LASTZ_REGISTRATION={inspectorClamp,inspectorZoom,registrationBody,terrainLabel,nextTerrain,availability,availabilityPatch,covers};boot();})();
</script></body></html>
