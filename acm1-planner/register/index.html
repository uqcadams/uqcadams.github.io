<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Alliance Registration · Last Z SVS Planner</title><style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;color:#eaf2fc;background:#0b1422;--accent:#69e0b4;--muted:#a2b4ca}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2d3b50;background:#101e30;padding:20px max(20px,calc((100vw - 960px)/2));display:flex;align-items:center;gap:14px}.logo{background:#1b4038;color:var(--accent);padding:12px;font-weight:900;border-radius:12px}h1{font-size:21px;margin:0}header p{margin:4px 0 0;color:var(--muted);font-size:13px}main{max-width:960px;padding:28px 20px 70px;margin:auto}.card{padding:25px;background:#112034;border:1px solid #30435b;border-radius:16px;margin-bottom:20px}h2{margin:0 0 12px;font-size:23px}h3{font-size:17px;margin:24px 0 10px}p{line-height:1.6}.muted,small{color:var(--muted);line-height:1.6}.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}label{display:block;font-size:14px;color:#c3d3e7;margin:16px 0 7px}input,select,textarea{width:100%;border:1px solid #405571;background:#0c192b;color:#f5f8ff;border-radius:9px;padding:12px;font:inherit;margin-top:7px}input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:2px}button{font:inherit;border:1px solid #415b73;border-radius:9px;background:#1b3046;color:#eaf2fc;padding:11px 16px;cursor:pointer;min-height:44px}button:hover{border-color:var(--accent)}button:disabled{opacity:.45;cursor:wait}.primary{background:var(--accent);color:#08251e;font-weight:750;border-color:var(--accent)}.wide{width:100%;margin-top:18px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.members{display:grid;gap:8px;max-height:450px;overflow:auto;margin:16px 0}.member{text-align:left;display:flex;justify-content:space-between;gap:12px;align-items:center}.member strong,.member small{display:block}.badge{border-radius:30px;background:#254339;color:#a9f3cf;padding:4px 9px;font-size:12px}.pending{background:#4b3d23;color:#ffe5ad}.notice{padding:14px 18px;border-radius:10px;background:#183e34;border:1px solid #4a9c80;margin:18px 0;line-height:1.6}.error{background:#432735;border-color:#bc657b;color:#ffe3eb}.window{background:#0c192b;padding:15px;border:1px solid #30435b;border-radius:12px;margin:12px 0}.window label{margin-top:0}.history{padding:12px 0;border-top:1px solid #32445c}a{color:var(--accent)}.join{max-width:540px;margin:36px auto}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.hidden{display:none}@media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:19px}main{padding:20px 12px}header{padding:18px}.topline{align-items:flex-start}h2{font-size:21px}.member{align-items:flex-start}.actions button{flex:1}}
</style></head><body><header><div class="logo">LZ</div><div><h1>Alliance Registration</h1><p>Last Z SVS Planner · your availability, your role</p></div></header><main id="app"></main><script>
(()=>{'use strict';const API='https://acm1-shared-rooms.duskyfield128.chatgpt.site',app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let code='',data=null,chosen=null,draft=null,busy=false,query='',notice='',error='',selfAdd=false,history=[];const roles=[['flexible','Flexible / officer decides'],['fighter','Fighter'],['rally-lead','Rally leader'],['reinforcement','Reinforcement'],['support','Support'],['scout','Scout']],statusLabel=v=>({available:'Available',unavailable:'Unavailable',unsure:'Unsure',unanswered:'No response'}[v]||'No response'),roleLabel=v=>roles.find(r=>r[0]===v)?.[1]||'Flexible';const options=(items,value)=>items.map(([key,label])=>`<option value="${key}" ${value===key?'selected':''}>${esc(label)}</option>`).join('');
async function api(path,method='GET',body){const res=await fetch(API+path,{method,headers:{...(code?{Authorization:'Bearer '+code}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const result=await res.json();if(!res.ok)throw Error(result.error||'Unable to complete this request.');return result;}
function time(offset){return new Date(Date.parse(data.instance.schedule.event)+offset*3600000)}function localInput(offset){const d=time(offset),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}function localLabel(offset){return time(offset).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'})}function readOffset(value){return (new Date(value).getTime()-Date.parse(data.instance.schedule.event))/3600000}function message(){return `${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${error?`<div class="notice error" role="alert">${esc(error)}</div>`:''}`}
function select(id){chosen=data.members.find(m=>m.id===id);if(!chosen)return;draft=structuredClone(data.registrations.find(r=>r.memberId===id)||{memberId:id,version:0,status:'unanswered',placement:'either',role:'flexible',windows:[],notes:''});selfAdd=false;history=[];error='';notice='';render();document.getElementById('person-title')?.focus();}
function render(){if(!data){app.innerHTML=`<section class="card join"><p class="eyebrow">Capital Clash · weekly check-in</p><h2>Plan your place in SvS</h2><p>Enter the code shared by your alliance leader, find your name, and tell your officers when you can join.</p><form id="join"><label>Alliance access code<input id="code" autocomplete="off" required placeholder="MEM-…" value="${esc(code)}"></label><button class="primary wide" ${busy?'disabled':''}>${busy?'Opening roster…':'Open alliance roster'}</button></form>${message()}<p class="muted">No account required. Anyone with the alliance code can update responses for that alliance. Please choose your own name.</p></section>`;document.getElementById('join').onsubmit=async e=>{e.preventDefault();code=document.getElementById('code').value.trim();busy=true;error='';render();try{data=await api('/api/registration/join','POST',{code});sessionStorage.setItem('lastz-registration-code',code);location.hash='';notice='';}catch(e){error=e.message;}busy=false;render();};return;}
const members=data.members.filter(m=>!query||(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())),selected=chosen&&data.members.find(m=>m.id===chosen.id),readOnly=data.instance.archived||!['member','officer','coordinator'].includes(data.access.role);
app.innerHTML=`<section class="card"><div class="topline"><div><p class="eyebrow">${esc(data.access.alliance||data.room.name)}</p><h2>${esc(chosen?'Your weekly check-in':'Find your name')}</h2></div><button id="leave">Change code</button></div><p class="muted">Week of ${esc(data.instance.week)} · APOC time is UTC−2.</p><div class="grid"><div><strong>Preparation · Saturday 00:00–12:00 APOC</strong><p class="muted">Your time: ${esc(localLabel(0))} → ${esc(localLabel(12))}</p></div><div><strong>Scoring · Saturday 12:00–16:00 APOC</strong><p class="muted">Your time: ${esc(localLabel(12))} → ${esc(localLabel(16))}</p></div></div></section>${message()}
${!chosen&&!selfAdd?`<section class="card"><label>Search the imported roster<input type="search" id="search" placeholder="Your in-game username" value="${esc(query)}"></label><div id="member-list" class="members">${memberButtons(members)}</div><button id="self-add" class="wide">I’m not on the list</button><p class="muted">Your name may look slightly different after screenshot import. Search before adding yourself.</p></section>`:''}
${selfAdd?`<section class="card"><h2>Add yourself to the roster</h2><p class="muted">Your officers will review this entry before automatic deployment. You can submit availability immediately.</p><form id="enroll"><label>Exact in-game username<input name="name" maxlength="120" required autocomplete="off"></label><label>HQ level<input name="level" type="number" min="1" max="99" required></label>${!data.access.alliance?'<label>Alliance<input name="alliance" required maxlength="120"></label>':''}<div class="actions"><button type="button" id="back">Back to roster</button><button class="primary" ${busy?'disabled':''}>Add me and continue</button></div></form></section>`:''}
${selected&&draft?`<section class="card"><button id="back">← Choose another member</button><h2 id="person-title" tabindex="-1" style="margin-top:22px">${esc(selected.name)}</h2><p class="muted">${esc(selected.alliance)} · HQ ${esc(selected.level||'?')}${draft.updatedAt?' · Updated '+esc(new Date(draft.updatedAt).toLocaleString()):''}</p>${selected.rosterStatus==='pending'?'<div class="notice pending">Pending roster review. Your roster entry is saved for officers to review. Submit your availability below; automatic deployment waits for approval.</div>':''}<form id="registration"><div class="grid"><label>Availability<select id="status">${options([['unanswered','Choose availability'],['available','Available'],['unavailable','Unavailable'],['unsure','Unsure']],draft.status)}</select></label><label>Preferred role<select id="role">${options(roles,draft.role||'flexible')}</select></label></div><label>Terrain preference<select id="placement">${options([['either','Either mud or grass'],['mud','Mud only'],['grass','Grass only'],['discuss','Discuss with an officer']],draft.placement)}</select></label><h3>When can you be online?</h3><p class="muted">Times below are in your device’s local time (${esc(Intl.DateTimeFormat().resolvedOptions().timeZone)}). Use a shortcut for the hours you can cover, or enter your own hours.</p><div class="actions"><button type="button" data-preset="0,12">Preparation</button><button type="button" data-preset="12,16">Scoring</button><button type="button" data-preset="0,16">Both periods</button></div>${draft.windows.map((w,i)=>`<div class="window"><div class="grid"><label>From<input type="datetime-local" data-edge="start" data-index="${i}" value="${localInput(w.start)}" required></label><label>Until<input type="datetime-local" data-edge="end" data-index="${i}" value="${localInput(w.end)}" required></label></div><button type="button" data-remove="${i}">Remove window</button></div>`).join('')}<button type="button" id="add-window" ${draft.windows.length>=12?'disabled':''}>+ Add availability window</button><label>Notes for your officers<textarea id="notes" rows="3" maxlength="1500" placeholder="Anything your officers should know?">${esc(draft.notes||'')}</textarea></label><button class="primary wide" ${busy||readOnly?'disabled':''}>${busy?'Saving…':'Save my registration'}</button></form><div class="actions"><button id="reload">Reload saved response</button><button id="history">Recent edit history</button></div>${history.map(e=>`<div class="history"><strong>${esc(e.actor)}</strong> · ${esc(new Date(e.created_at).toLocaleString())}<p class="muted">${esc(statusLabel(e.changes.after?.status))} · ${esc(roleLabel(e.changes.after?.role))}</p></div>`).join('')}</section>`:''}`;
document.getElementById('leave').onclick=()=>{data=null;chosen=null;draft=null;code='';sessionStorage.removeItem('lastz-registration-code');notice='';error='';render();};const search=document.getElementById('search');if(search)search.oninput=()=>{query=search.value;document.getElementById('member-list').innerHTML=memberButtons(data.members.filter(m=>(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())));bindMembers();};bindMembers();document.getElementById('self-add')?.addEventListener('click',()=>{selfAdd=true;render()});document.getElementById('back')?.addEventListener('click',()=>{selfAdd=false;chosen=null;draft=null;notice='';error='';render()});document.getElementById('enroll')?.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target);busy=true;e.target.querySelector('.primary').disabled=true;error='';try{const result=await api('/api/registration/members','POST',{name:f.get('name'),level:Number(f.get('level')),alliance:f.get('alliance'),week:data.instance.week,actor:f.get('name')});data=result.state;busy=false;select(result.memberId);notice=result.existing?'You are already on the roster. Complete your registration below.':'Added for officer review. Complete your availability below.';}catch(e){error=e.message;busy=false;}render();});
if(!selected||!draft)return;const readDraft=()=>{draft.status=document.getElementById('status').value;draft.role=document.getElementById('role').value;draft.placement=document.getElementById('placement').value;draft.notes=document.getElementById('notes').value;document.querySelectorAll('[data-edge]').forEach(el=>draft.windows[Number(el.dataset.index)][el.dataset.edge]=readOffset(el.value));};document.querySelectorAll('[data-preset]').forEach(el=>el.onclick=()=>{readDraft();const [start,end]=el.dataset.preset.split(',').map(Number);draft.windows=[{start,end}];draft.status='available';render();});document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{readDraft();draft.windows.splice(Number(el.dataset.remove),1);render();});document.getElementById('add-window').onclick=()=>{readDraft();draft.windows.push({start:12,end:16});render();};document.getElementById('registration').onsubmit=async e=>{e.preventDefault();readDraft();error='';notice='';if(draft.status==='unanswered'||draft.status==='available'&&!draft.windows.length){error='Choose availability and add the hours you can cover.';render();return;}if(draft.windows.some(w=>!Number.isFinite(w.start)||!Number.isFinite(w.end)||w.start< -24||w.end>72||w.end<=w.start)){error='Check your hours: each end must follow its start, between Friday and Sunday.';render();return;}busy=true;render();try{const result=await api('/api/register','PUT',{...draft,week:data.instance.week,actor:selected.name});data.registrations=data.registrations.filter(r=>r.memberId!==selected.id).concat(result);draft=result;notice='Your registration is saved. You can return with the same code to update it.';}catch(e){error=e.message;}busy=false;render();};document.getElementById('reload').onclick=async()=>{try{data=await api('/api/registration/state');select(selected.id);}catch(e){error=e.message;render();}};document.getElementById('history').onclick=async()=>{try{history=(await api('/api/history?memberId='+encodeURIComponent(selected.id))).edits.filter(e=>e.kind==='registration');error='';}catch(e){error=e.message;}render();};}
function memberButtons(members){return members.length?members.map(m=>{const r=data.registrations.find(r=>r.memberId===m.id);return `<button class="member" data-member="${esc(m.id)}"><span><strong>${esc(m.name)}</strong><small>${esc(m.alliance)} · HQ ${esc(m.level||'?')} · ${esc(statusLabel(r?.status))}</small></span>${m.rosterStatus==='pending'?'<span class="badge pending">Pending review</span>':r?'<span class="badge">Responded</span>':''}</button>`}).join(''):'<p class="muted">No matching members found.</p>';}function bindMembers(){document.querySelectorAll('[data-member]').forEach(el=>el.onclick=()=>select(el.dataset.member));}async function boot(){try{code=new URLSearchParams(location.hash.slice(1)).get('code')||sessionStorage.getItem('lastz-registration-code')||'';if(code){busy=true;render();data=await api('/api/registration/join','POST',{code});sessionStorage.setItem('lastz-registration-code',code);location.hash='';}}catch(e){error=e.message;}busy=false;render();}boot();})();
</script></body></html>
