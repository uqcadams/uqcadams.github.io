</style></head><body><header><div class="logo">LZ</div><div><h1>Alliance Registration</h1><p>Last Z SVS Planner · a quick weekly check-in</p></div></header><main id="app"></main><script>
(()=>{'use strict';const API='https://acm1-shared-rooms.duskyfield128.chatgpt.site',app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let code='',data=null,query='',notice='',error='',joining=false,addBusy=false,note=null,highlight='',adding=false;const saving=new Set(),saved=new Set();let addDraft={name:'',level:'',placement:'grass',status:'unanswered',windows:[],notes:'',memberId:null,alliance:''};
function baseRegistration(id){return structuredClone(data.registrations.find(r=>r.memberId===id)||{memberId:id,version:0,status:'unanswered',placement:'grass',role:'flexible',windows:[],notes:''});}
function registrationBody(base,patch){const next={...base,...patch,windows:structuredClone(patch.windows??base.windows??[])};if(patch.status==='available'&&!next.windows.length)next.windows=[{start:12,end:16}];return next;}
function terrainLabel(r){return r.placement==='mud'?'Mud':r.placement==='grass'?'Grass':r.version>0?(r.placement==='discuss'?'Discuss':'Either'):'Grass';}function nextTerrain(r){return r.placement==='grass'?'mud':'grass';}
function storedCode(){try{return sessionStorage.getItem('lastz-registration-code')||'';}catch{return '';}}function rememberCode(value){try{if(value)sessionStorage.setItem('lastz-registration-code',value);else sessionStorage.removeItem('lastz-registration-code');}catch{}}
async function api(path,method='GET',body){const res=await fetch(API+path,{method,headers:{...(code?{Authorization:'Bearer '+code}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let result;try{result=await res.json();}catch{throw Error('The service did not respond. Please try again.');}if(!res.ok)throw Error(result.error||'Unable to save. Please try again.');return result;}
function readOnly(){return data?.instance.archived||data?.instance.closed||!['member','officer','coordinator'].includes(data?.access.role);}function message(){return `${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${error?`<div class="notice error" role="alert">${esc(error)} ${data?'<button id="refresh">Reload latest responses</button>':''}</div>`:''}`;}function localTime(offset){return new Date(Date.parse(data.instance.schedule.event)+offset*3600000).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'});}
const icon=(name)=>{const paths={circle:'<circle cx="12" cy="12" r="9"/>',check:'<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',close:'<circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',before:'<path d="M3 18h18M5 14a7 7 0 0 1 14 0M12 2v3M3 6l2 2m16-2-2 2"/>',during:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/>',grass:'<path d="M12 21v-9m0 4C4 16 4 7 4 7s8-1 8 9Zm0-3c0-8 8-9 8-9s1 9-8 9Z"/>',mud:'<path d="m3 7 9-4 9 4-9 4-9-4Zm0 5 9 4 9-4M3 17l9 4 9-4"/>',note:'<path d="M14 3H5v18h14V8l-5-5Zm0 0v5h5M8 12h8m-8 4h6"/>',plus:'<path d="M12 5v14M5 12h14"/>'};return `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="icon" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name]||paths.circle}</svg>`;};
function covers(windows,start,end){let at=start;for(const w of [...(windows||[])].sort((a,b)=>a.start-b.start)){if(w.end<=at)continue;if(w.start>at+1e-6)break;at=Math.max(at,w.end);if(at>=end-1e-6)return true;}return false;}
function availability(r){return {before:r.status==='available'&&covers(r.windows,0,12),during:r.status==='available'&&covers(r.windows,12,16),unavailable:r.status==='unavailable'};}
function availabilityPatch(r,key){const state=availability(r);if(key==='unavailable')return {status:state.unavailable?'unanswered':'unavailable',windows:[]};state[key]=!state[key];state.unavailable=false;const windows=[];if(state.before)windows.push({start:0,end:12});if(state.during)windows.push({start:12,end:16});return {status:windows.length?'available':'unanswered',windows};}
function statusMarkup(r){const kind=r.status==='available'?'available':r.status==='unavailable'?'unavailable':'unanswered',label=kind==='available'?'Available':kind==='unavailable'?'Unavailable':'Not responded';return `<span class="status-chip ${kind}">${icon(kind==='available'?'check':kind==='unavailable'?'close':'circle')}${label}</span>`;}
function controls(id,name,r,disabled=false,isAdd=false){const a=availability(r),off=disabled?'disabled':'',button=(key,label,time,symbol)=>`<button type="button" class="availability-option ${a[key]?'selected':''} ${key==='unavailable'?'unavailable-option':''}" data-action="${key}" data-id="${esc(id)}" aria-label="${label} for ${esc(name)}" aria-pressed="${a[key]}" ${off}>${icon(a[key]?'check':symbol)}<span>${label}<small>${time}</small></span></button>`;return `<div class="controls"><div class="availability-group" role="group" aria-label="Availability for ${esc(name)}"><span class="control-label">Availability</span><div class="availability-options">${button('before','Before Clash','00:00–12:00 APOC','before')}${button('during','During Clash','12:00–16:00 APOC','during')}${button('unavailable','Unavailable','Cannot attend','close')}</div>${r.status==='available'&&!a.before&&!a.during?'<small class="custom-hours">Custom hours saved</small>':''}</div><div class="terrain-notes"><div class="terrain-group" role="group" aria-label="Terrain for ${esc(name)}"><span class="control-label">Terrain</span><div class="terrain-options">${['grass','mud'].map(key=>`<button type="button" data-action="${key}" data-id="${esc(id)}" class="terrain-option ${r.placement===key?'selected':''}" aria-label="${key==='grass'?'Grass':'Mud'} for ${esc(name)}" aria-pressed="${r.placement===key}" ${off}>${icon(key)}${key==='grass'?'Grass':'Mud'}</button>`).join('')}</div>${r.version>0&&!['grass','mud'].includes(r.placement)?`<small class="custom-hours">Saved: ${r.placement==='discuss'?'Discuss with officer':'Either terrain'}</small>`:''}</div><button type="button" class="note ${r.notes?'has-note':''}" data-action="note" data-id="${esc(id)}" aria-label="${r.notes?'Edit':'Add'} note for ${esc(name)}" ${off}>${icon('note')}<span>${r.notes?'Edit note':'Note'}</span>${r.notes?'<span class="note-dot" aria-hidden="true"></span>':''}</button></div></div>`;}
function rows(members){return members.length?members.map(m=>{const r=baseRegistration(m.id),busy=saving.has(m.id);return `<article class="member-row ${highlight===m.id?'highlight':''}" data-member="${esc(m.id)}" aria-label="${esc(m.name)} registration"><div class="member-heading"><div class="identity"><strong>${esc(m.name)}</strong><span class="hq">HQ ${esc(m.level||'—')}</span></div><div class="member-status">${statusMarkup(r)}${m.rosterStatus==='pending'?'<span class="pending-badge">Pending review</span>':''}<span class="save-status" role="status">${busy?icon('clock')+'Saving…':saved.has(m.id)?icon('check')+'Saved':''}</span></div></div>${controls(m.id,m.name,r,busy||readOnly())}</article>`}).join(''):'<p class="empty">No matching members. Add yourself below.</p>';}
function bindControls(root=app){root.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{const id=el.dataset.id,action=el.dataset.action,isAdd=id==='new-member',r=isAdd?addDraft:baseRegistration(id);if(action==='note'){note={id,name:isAdd?'New member':data.members.find(m=>m.id===id)?.name||'Member',text:r.notes||'',busy:false,error:''};render();return;}const patch=['before','during','unavailable'].includes(action)?availabilityPatch(r,action):{placement:action};if(isAdd){Object.assign(addDraft,patch);render();return;}await saveRow(id,patch,action);});}

async function saveRow(id,patch,focusAction){if(saving.has(id)||readOnly())return false;const member=data.members.find(m=>m.id===id);if(!member)return false;saving.add(id);saved.delete(id);error='';notice='';render();try{const r=await api('/api/register','PUT',{...registrationBody(baseRegistration(id),patch),week:data.instance.week,actor:member.name});data.registrations=data.registrations.filter(q=>q.memberId!==id).concat(r);saved.add(id);saving.delete(id);render();if(focusAction)app.querySelector(`[data-action="${focusAction}"][data-id="${CSS.escape(id)}"]`)?.focus();return true;}catch(e){saving.delete(id);error=e.message;render();return false;}}
function render(){if(!data){app.innerHTML=`<section class="card join"><p class="eyebrow">Capital Clash · weekly check-in</p><h2>Open your alliance roster</h2><p>Enter the code from your alliance leader to set your availability and terrain preference.</p><form id="join"><label>Alliance access code<input id="code" autocomplete="off" required placeholder="ACM1-OCT31" value="${esc(code)}"></label><button class="primary wide" ${joining?'disabled':''}>${joining?'Opening roster…':'Open alliance roster'}</button></form>${message()}<p class="footer-note">No account required. Anyone with the code can update this alliance’s responses.</p></section>`;document.getElementById('join').onsubmit=async e=>{e.preventDefault();code=document.getElementById('code').value.trim();joining=true;error='';render();try{data=await api('/api/registration/join','POST',{code});rememberCode(code);history.replaceState(null,'',/^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+$/.test(code)?'/acm1-planner/register/'+encodeURIComponent(code.toUpperCase()):'/acm1-planner/register/');notice='';}catch(e){error=e.message;}joining=false;render();};return;}
const members=data.members.filter(m=>!query||(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())),confirmed=data.members.filter(m=>data.registrations.find(r=>r.memberId===m.id)?.status==='available').length;
app.innerHTML=`<section class="card"><div class="topline"><div><p class="eyebrow">${esc(data.access.alliance||data.room.name)}</p><h2>Your weekly check-in</h2></div><button id="leave">Change code</button></div><p class="muted">Find your name, select your availability and terrain. Changes save automatically.</p><details><summary>Event times · week of ${esc(data.instance.week)}</summary><p>Before Clash: Saturday 00:00–12:00 APOC. During Clash: Saturday 12:00–16:00 APOC (UTC−2). Your local time — Before: ${esc(localTime(0))} → ${esc(localTime(12))}; During: ${esc(localTime(12))} → ${esc(localTime(16))}. Add any limitations in your note. Previously saved custom hours and roles are preserved.</p></details></section>${data.instance.closed?'<div class="notice" role="status">This room is closed. Registration is available read-only.</div>':''}${message()}<section class="card"><div class="topline"><h2>Alliance roster <span class="count">${confirmed} available / ${data.members.length} members</span></h2><button id="add-link">+ Missing member</button></div><label class="search">Find your name<input type="search" id="search" placeholder="Search players…" value="${esc(query)}"></label><div class="roster-head"><span>Name</span><span>HQ</span><span>Terrain · confirmation · note</span></div><div id="member-list">${rows(members)}</div><p class="footer-note">You can select both periods. Unavailable clears both. Add a note for any exceptions.</p>${adding?`<section class="add-box" id="add-box"><h3>Add a missing member</h3><form id="enroll" class="add-row"><label><span class="muted">Name</span><input name="name" aria-label="New member name" maxlength="120" autocomplete="off" value="${esc(addDraft.name)}" required ${addBusy?'disabled':''}></label><label><span class="muted">HQ</span><input name="level" aria-label="New member HQ level" type="number" min="1" max="99" value="${esc(addDraft.level)}" required ${addBusy?'disabled':''}></label>${!data.access.alliance?`<label><span class="muted">Alliance</span><input name="alliance" aria-label="New member alliance" maxlength="120" value="${esc(addDraft.alliance)}" required ${addBusy?'disabled':''}></label>`:''}${controls('new-member','new member',addDraft,addBusy||readOnly(),true)}<button class="primary add-submit" ${addBusy||readOnly()?'disabled':''}>${addBusy?'Saving…':addDraft.memberId?'Save registration':'Add member'}</button></form><p class="footer-note">New entries need officer approval before automatic deployment.</p></section>`:''}</section>${note?`<dialog id="note-dialog" aria-labelledby="note-title"><form id="note-form"><h2 id="note-title">Note · ${esc(note.name)}</h2><label>Optional note<textarea id="note-text" rows="5" maxlength="1500" placeholder="Availability limits, preferred role, or anything your officers should know…" ${note.busy?'disabled':''}>${esc(note.text)}</textarea></label>${note.error?`<p class="notice error" role="alert">${esc(note.error)}</p>`:''}<div class="actions"><button type="button" id="note-cancel" ${note.busy?'disabled':''}>Cancel</button><button class="primary" ${note.busy?'disabled':''}>${note.busy?'Saving…':'Save note'}</button></div></form></dialog>`:''}`;
document.getElementById('leave').onclick=()=>{if(saving.size||addBusy)return;data=null;code='';note=null;rememberCode('');history.replaceState(null,'','/acm1-planner/register/');notice='';error='';render();};document.getElementById('refresh')?.addEventListener('click',async()=>{try{data=await api('/api/registration/state');error='';notice='Latest responses loaded. Please retry your change.';}catch(e){error=e.message;}render();});const search=document.getElementById('search');search.oninput=()=>{query=search.value;document.getElementById('member-list').innerHTML=rows(data.members.filter(m=>(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())));bindControls(document.getElementById('member-list'));};document.getElementById('add-link').onclick=()=>{adding=true;if(!addDraft.name)addDraft.name=query;if(!data.access.alliance&&!addDraft.alliance){const tags=[...new Set(data.members.map(m=>m.alliance).filter(Boolean))];if(tags.length===1)addDraft.alliance=tags[0];}render();document.querySelector('input[name="name"]')?.focus();document.getElementById('add-box')?.scrollIntoView({block:'nearest',behavior:'smooth'});};bindControls();const form=document.getElementById('enroll');if(form){form.elements.name.oninput=e=>addDraft.name=e.target.value;form.elements.level.oninput=e=>addDraft.level=e.target.value;if(form.elements.alliance)form.elements.alliance.oninput=e=>addDraft.alliance=e.target.value;form.onsubmit=async e=>{e.preventDefault();if(addBusy||readOnly())return;addBusy=true;error='';notice='';render();try{if(!addDraft.memberId){const result=await api('/api/registration/members','POST',{name:addDraft.name,level:Number(addDraft.level),alliance:addDraft.alliance||data.access.alliance,week:data.instance.week,actor:addDraft.name});data=result.state;if(result.existing){highlight=result.memberId;throw Error('This member is already on the roster. Use their existing row above.');}addDraft.memberId=result.memberId;}const id=addDraft.memberId,r=await api('/api/register','PUT',{...registrationBody(baseRegistration(id),{status:addDraft.status,windows:addDraft.windows,placement:addDraft.placement,notes:addDraft.notes}),week:data.instance.week,actor:addDraft.name});data.registrations=data.registrations.filter(q=>q.memberId!==id).concat(r);saved.add(id);highlight=id;notice=addDraft.name+' added with their preferences. Pending officer approval.';addDraft={name:'',level:'',placement:'grass',status:'unanswered',windows:[],notes:'',memberId:null,alliance:''};adding=false;query='';}catch(e){error=e.message;}addBusy=false;render();};}
if(note){const dialog=document.getElementById('note-dialog');dialog.showModal();const input=document.getElementById('note-text');input.oninput=()=>note.text=input.value;if(!note.busy)input.focus();const close=()=>{if(note.busy)return;const id=note.id;note=null;render();app.querySelector(`[data-action="note"][data-id="${CSS.escape(id)}"]`)?.focus();};dialog.oncancel=e=>{e.preventDefault();close();};document.getElementById('note-cancel').onclick=close;document.getElementById('note-form').onsubmit=async e=>{e.preventDefault();if(note.busy)return;const current=note;if(current.id==='new-member'){addDraft.notes=current.text;close();return;}current.busy=true;render();const ok=await saveRow(current.id,{notes:current.text});if(ok){current.busy=false;close();}else{current.busy=false;current.error=error;render();}};}}
async function boot(){try{const params=new URLSearchParams(location.search),pathCode=location.pathname.match(/^\/acm1-planner\/register\/([A-Za-z0-9-]+)\/?$/)?.[1];code=pathCode||params.get('code')||new URLSearchParams(location.hash.slice(1)).get('code')||storedCode();if(code){joining=true;render();data=await api('/api/registration/join','POST',{code});rememberCode(code);history.replaceState(null,'',/^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+$/.test(code)?'/acm1-planner/register/'+encodeURIComponent(code.toUpperCase()):'/acm1-planner/register/');}}catch(e){error=e.message;}joining=false;render();}
window.LASTZ_REGISTRATION={registrationBody,terrainLabel,nextTerrain,availability,availabilityPatch,covers};boot();})();
