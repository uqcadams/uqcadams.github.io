<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Alliance Registration · Last Z SVS Planner</title><style>
:root{color-scheme:dark;font:15px system-ui,sans-serif;color:#eaf2fc;background:#0b1422;--accent:#69e0b4;--muted:#a2b4ca}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2d3b50;background:#101e30;padding:18px max(20px,calc((100vw - 1060px)/2));display:flex;align-items:center;gap:13px}.logo{background:#1b4038;color:var(--accent);padding:11px;font-weight:900;border-radius:10px}h1{font-size:20px;margin:0}header p{margin:3px 0 0;color:var(--muted);font-size:12px}main{max-width:1100px;padding:25px 20px 60px;margin:auto}.card{padding:23px;background:#112034;border:1px solid #30435b;border-radius:14px;margin-bottom:18px}h2{margin:0 0 10px;font-size:22px}p{line-height:1.6}.muted,small{color:var(--muted);line-height:1.6}.eyebrow{color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase}label{display:block;font-size:13px;color:#c3d3e7;margin:13px 0 7px}input,textarea{width:100%;border:1px solid #405571;background:#0c192b;color:#f5f8ff;border-radius:8px;padding:11px;font:inherit}label input,label textarea{margin-top:7px}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button{font:inherit;border:1px solid #415b73;border-radius:8px;background:#1b3046;color:#eaf2fc;padding:10px 13px;cursor:pointer;min-height:42px}button:hover{border-color:var(--accent)}button:disabled{opacity:.5;cursor:wait}.primary{background:var(--accent);color:#08251e;font-weight:750;border-color:var(--accent)}.wide{width:100%;margin-top:17px}.actions,.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions{margin-top:15px}.notice{padding:12px 15px;border-radius:9px;background:#183e34;border:1px solid #4a9c80;margin:14px 0;line-height:1.5}.error{background:#432735;border-color:#bc657b;color:#ffe3eb}.join{max-width:510px;margin:35px auto}.topline{display:flex;justify-content:space-between;gap:15px;align-items:center}.roster-head,.member-row,.add-row{display:grid;grid-template-columns:minmax(180px,1fr) 58px 365px;gap:16px;align-items:center}.roster-head{font-size:12px;color:var(--muted);padding:0 10px 10px;border-bottom:1px solid #30435b}.member-row{padding:14px 10px;border-bottom:1px solid #2a3d54;scroll-margin-top:30px}.member-name{font-weight:700;overflow-wrap:anywhere;min-width:0}.member-name small{display:block;font-weight:400;font-size:11px}.level{font-variant-numeric:tabular-nums;color:#c3d3e7}.controls button{white-space:nowrap;font-size:13px;font-weight:650}.terrain{min-width:108px}.confirm{min-width:153px}.confirmed{background:#194a3d;border-color:#57b991;color:#b9ffe3}.mud{background:#503e2c;border-color:#9e7a53;color:#ffdfb4}.note{font-size:18px!important;min-width:45px;position:relative}.note.has-note:after{content:'';width:7px;height:7px;border-radius:50%;background:var(--accent);position:absolute;top:5px;right:5px}.badge{color:#ffe0a8}.save-status{font-size:11px;color:var(--accent)}.add-box{margin-top:25px;padding:17px;background:#0c192b;border:1px solid #36516c;border-radius:11px}.add-row{grid-template-columns:minmax(150px,1fr) 65px auto auto;gap:10px}.add-row label{margin:0}.add-row input{margin-top:0}.add-box h3{margin:0 0 13px;font-size:16px}.search{max-width:450px;margin:14px 0 20px}.count{color:var(--muted);font-size:13px;font-weight:400}details{color:var(--muted);font-size:12px;line-height:1.6}summary{cursor:pointer}.empty{padding:25px 10px;color:var(--muted)}dialog{color:#eaf2fc;background:#112034;border:1px solid #526880;border-radius:14px;padding:25px;width:min(490px,calc(100vw - 28px));max-height:calc(100dvh - 35px);overflow:auto}dialog::backdrop{background:#020814b8}dialog h2{font-size:20px}dialog .actions{justify-content:flex-end}a{color:var(--accent)}.highlight{background:#1b3f36}.footer-note{font-size:12px;color:var(--muted);margin-bottom:0}@media(max-width:800px){.roster-head,.member-row{grid-template-columns:minmax(140px,1fr) 45px 325px;gap:10px}.controls{gap:6px}.controls button{padding:9px 10px}.confirm{min-width:140px}.terrain{min-width:100px}.add-row{grid-template-columns:minmax(120px,1fr) 65px}.add-row .controls{grid-column:1/-1}.add-row .add-submit{grid-column:1/-1}.card{padding:18px}}@media(max-width:600px){main{padding:18px 10px}.card{padding:16px}header{padding:16px}.topline{align-items:flex-start}.roster-head{display:none}.member-row{grid-template-columns:minmax(0,1fr) 52px;padding:15px 2px;gap:9px}.member-row .controls{grid-column:1/-1;display:grid;grid-template-columns:1fr 1.4fr 45px;gap:7px}.controls .terrain,.controls .confirm{min-width:0;width:100%}.member-name{font-size:15px}.level{text-align:right}.search{max-width:none}.add-box{padding:13px}.add-row .controls{display:grid;grid-template-columns:1fr 1.4fr 45px;gap:7px}.join{margin:20px auto}}
</style></head><body><header><div class="logo">LZ</div><div><h1>Alliance Registration</h1><p>Last Z SVS Planner · a quick weekly check-in</p></div></header><main id="app"></main><script>
(()=>{'use strict';const API='https://acm1-shared-rooms.duskyfield128.chatgpt.site',app=document.getElementById('app'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let code='',data=null,query='',notice='',error='',joining=false,addBusy=false,note=null,highlight='',adding=false;const saving=new Set(),saved=new Set();let addDraft={name:'',level:'',placement:'grass',confirmed:false,notes:'',memberId:null,alliance:''};
function baseRegistration(id){return structuredClone(data.registrations.find(r=>r.memberId===id)||{memberId:id,version:0,status:'unanswered',placement:'grass',role:'flexible',windows:[],notes:''});}
function registrationBody(base,patch){const next={...base,...patch,windows:structuredClone(base.windows||[])};if(patch.status==='available'&&!next.windows.length)next.windows=[{start:12,end:16}];return next;}
function terrainLabel(r){return r.placement==='mud'?'Mud ✅':r.placement==='grass'?'Grass ✅':r.version>0?(r.placement==='discuss'?'Discuss 🗒️':'Either ↔'):'Grass ✅';}function nextTerrain(r){return r.placement==='grass'?'mud':'grass';}
async function api(path,method='GET',body){const res=await fetch(API+path,{method,headers:{...(code?{Authorization:'Bearer '+code}:{}),...(body?{'Content-Type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});let result;try{result=await res.json();}catch{throw Error('The service did not respond. Please try again.');}if(!res.ok)throw Error(result.error||'Unable to save. Please try again.');return result;}
function readOnly(){return data?.instance.archived||!['member','officer','coordinator'].includes(data?.access.role);}function message(){return `${notice?`<div class="notice" role="status">${esc(notice)}</div>`:''}${error?`<div class="notice error" role="alert">${esc(error)} ${data?'<button id="refresh">Reload latest responses</button>':''}</div>`:''}`;}function localTime(offset){return new Date(Date.parse(data.instance.schedule.event)+offset*3600000).toLocaleString(undefined,{weekday:'short',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',timeZoneName:'short'});}
function controls(id,name,r,disabled=false,isAdd=false){const confirmed=isAdd?r.confirmed:r.status==='available';return `<div class="controls"><button type="button" class="terrain ${r.placement==='mud'?'mud':''}" data-action="terrain" data-id="${esc(id)}" aria-label="Terrain for ${esc(name)}: ${esc(terrainLabel(r))}" ${disabled?'disabled':''}>${terrainLabel(r)}</button><button type="button" class="confirm ${confirmed?'confirmed':''}" data-action="confirm" data-id="${esc(id)}" aria-label="Toggle confirmation for ${esc(name)}" aria-pressed="${confirmed}" ${disabled?'disabled':''}>${confirmed?'Confirmed ✅':'Unconfirmed ❎'}</button><button type="button" class="note ${r.notes?'has-note':''}" data-action="note" data-id="${esc(id)}" aria-label="${r.notes?'Edit':'Add'} note for ${esc(name)}" title="${r.notes?'Edit note':'Add optional note'}" ${disabled?'disabled':''}>🗒️</button></div>`;}
function rows(members){return members.length?members.map(m=>{const r=baseRegistration(m.id),busy=saving.has(m.id);return `<div class="member-row ${highlight===m.id?'highlight':''}" data-member="${esc(m.id)}"><div class="member-name">${esc(m.name)}<small>${esc(m.alliance)}${m.rosterStatus==='pending'?' · <span class="badge">Pending roster review</span>':''}${busy?' · <span class="save-status" role="status">Saving…</span>':saved.has(m.id)?' · <span class="save-status" role="status">Saved</span>':''}</small></div><span class="level" aria-label="HQ level ${esc(m.level||'unknown')}">${esc(m.level||'—')}</span>${controls(m.id,m.name,r,busy||readOnly())}</div>`}).join(''):'<p class="empty">No matching members. You can add yourself below.</p>';}
function bindControls(root=app){root.querySelectorAll('[data-action]').forEach(el=>el.onclick=async()=>{const id=el.dataset.id,action=el.dataset.action,isAdd=id==='new-member',r=isAdd?addDraft:baseRegistration(id);if(action==='note'){note={id,name:isAdd?'New member':data.members.find(m=>m.id===id)?.name||'Member',text:r.notes||'',busy:false,error:''};render();return;}if(isAdd){if(action==='terrain')addDraft.placement=nextTerrain(r);else addDraft.confirmed=!addDraft.confirmed;render();return;}const patch=action==='terrain'?{placement:nextTerrain(r)}:{status:r.status==='available'?'unanswered':'available'};await saveRow(id,patch,action);});}
async function saveRow(id,patch,focusAction){if(saving.has(id)||readOnly())return false;const member=data.members.find(m=>m.id===id);if(!member)return false;saving.add(id);saved.delete(id);error='';notice='';render();try{const r=await api('/api/register','PUT',{...registrationBody(baseRegistration(id),patch),week:data.instance.week,actor:member.name});data.registrations=data.registrations.filter(q=>q.memberId!==id).concat(r);saved.add(id);saving.delete(id);render();if(focusAction)app.querySelector(`[data-action="${focusAction}"][data-id="${CSS.escape(id)}"]`)?.focus();return true;}catch(e){saving.delete(id);error=e.message;render();return false;}}
function render(){if(!data){app.innerHTML=`<section class="card join"><p class="eyebrow">Capital Clash · weekly check-in</p><h2>Open your alliance roster</h2><p>Enter your alliance code, choose Grass or Mud, and confirm. That’s it.</p><form id="join"><label>Alliance access code<input id="code" autocomplete="off" required placeholder="MEM-…" value="${esc(code)}"></label><button class="primary wide" ${joining?'disabled':''}>${joining?'Opening roster…':'Open alliance roster'}</button></form>${message()}<p class="footer-note">No account required. Anyone with the code can update this alliance’s responses.</p></section>`;document.getElementById('join').onsubmit=async e=>{e.preventDefault();code=document.getElementById('code').value.trim();joining=true;error='';render();try{data=await api('/api/registration/join','POST',{code});sessionStorage.setItem('lastz-registration-code',code);history.replaceState(null,'',location.pathname+location.search);notice='';}catch(e){error=e.message;}joining=false;render();};return;}
const members=data.members.filter(m=>!query||(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())),confirmed=data.members.filter(m=>data.registrations.find(r=>r.memberId===m.id)?.status==='available').length;
app.innerHTML=`<section class="card"><div class="topline"><div><p class="eyebrow">${esc(data.access.alliance||data.room.name)}</p><h2>Choose terrain. Confirm. Done.</h2></div><button id="leave">Change code</button></div><p class="muted">Find your name below. Your changes save automatically. Use 🗒️ for any notes.</p><details><summary>Event times · week of ${esc(data.instance.week)}</summary><p>Confirm participation in capital scoring: Saturday 12:00–16:00 APOC (UTC−2). Your local time: ${esc(localTime(12))} → ${esc(localTime(16))}. Add any limitations in your note. Previously saved custom hours and roles are preserved.</p></details></section>${message()}<section class="card"><div class="topline"><h2>Alliance roster <span class="count">${confirmed} confirmed / ${data.members.length}</span></h2><button id="add-link">+ Missing member</button></div><label class="search">Find your name<input type="search" id="search" placeholder="Search players…" value="${esc(query)}"></label><div class="roster-head"><span>Name</span><span>HQ</span><span>Terrain · confirmation · note</span></div><div id="member-list">${rows(members)}</div><p class="footer-note">Tap Grass to switch to Mud. Tap confirmation to change it. A dot on 🗒️ means a note is saved.</p>${adding?`<section class="add-box" id="add-box"><h3>Add a missing member</h3><form id="enroll" class="add-row"><label><span class="muted">Name</span><input name="name" aria-label="New member name" maxlength="120" autocomplete="off" value="${esc(addDraft.name)}" required ${addBusy?'disabled':''}></label><label><span class="muted">HQ</span><input name="level" aria-label="New member HQ level" type="number" min="1" max="99" value="${esc(addDraft.level)}" required ${addBusy?'disabled':''}></label>${!data.access.alliance?`<label><span class="muted">Alliance</span><input name="alliance" aria-label="New member alliance" maxlength="120" value="${esc(addDraft.alliance)}" required ${addBusy?'disabled':''}></label>`:''}${controls('new-member','new member',addDraft,addBusy||readOnly(),true)}<button class="primary add-submit" ${addBusy||readOnly()?'disabled':''}>${addBusy?'Saving…':addDraft.memberId?'Save registration':'Add member'}</button></form><p class="footer-note">New entries need officer approval before automatic deployment.</p></section>`:''}</section>${note?`<dialog id="note-dialog" aria-labelledby="note-title"><form id="note-form"><h2 id="note-title">Note · ${esc(note.name)}</h2><label>Optional note<textarea id="note-text" rows="5" maxlength="1500" placeholder="Availability limits, preferred role, or anything your officers should know…" ${note.busy?'disabled':''}>${esc(note.text)}</textarea></label>${note.error?`<p class="notice error" role="alert">${esc(note.error)}</p>`:''}<div class="actions"><button type="button" id="note-cancel" ${note.busy?'disabled':''}>Cancel</button><button class="primary" ${note.busy?'disabled':''}>${note.busy?'Saving…':'Save note'}</button></div></form></dialog>`:''}`;
document.getElementById('leave').onclick=()=>{if(saving.size||addBusy)return;data=null;code='';note=null;sessionStorage.removeItem('lastz-registration-code');notice='';error='';render();};document.getElementById('refresh')?.addEventListener('click',async()=>{try{data=await api('/api/registration/state');error='';notice='Latest responses loaded. Please retry your change.';}catch(e){error=e.message;}render();});const search=document.getElementById('search');search.oninput=()=>{query=search.value;document.getElementById('member-list').innerHTML=rows(data.members.filter(m=>(m.name+' '+m.alliance).toLocaleLowerCase().includes(query.toLocaleLowerCase())));bindControls(document.getElementById('member-list'));};document.getElementById('add-link').onclick=()=>{adding=true;if(!addDraft.name)addDraft.name=query;if(!data.access.alliance&&!addDraft.alliance){const tags=[...new Set(data.members.map(m=>m.alliance).filter(Boolean))];if(tags.length===1)addDraft.alliance=tags[0];}render();document.querySelector('input[name="name"]')?.focus();document.getElementById('add-box')?.scrollIntoView({block:'nearest',behavior:'smooth'});};bindControls();const form=document.getElementById('enroll');if(form){form.elements.name.oninput=e=>addDraft.name=e.target.value;form.elements.level.oninput=e=>addDraft.level=e.target.value;if(form.elements.alliance)form.elements.alliance.oninput=e=>addDraft.alliance=e.target.value;form.onsubmit=async e=>{e.preventDefault();if(addBusy||readOnly())return;addBusy=true;error='';notice='';render();try{if(!addDraft.memberId){const result=await api('/api/registration/members','POST',{name:addDraft.name,level:Number(addDraft.level),alliance:addDraft.alliance||data.access.alliance,week:data.instance.week,actor:addDraft.name});data=result.state;if(result.existing){highlight=result.memberId;throw Error('This member is already on the roster. Use their existing row above.');}addDraft.memberId=result.memberId;}const id=addDraft.memberId,r=await api('/api/register','PUT',{...registrationBody(baseRegistration(id),{status:addDraft.confirmed?'available':'unanswered',placement:addDraft.placement,notes:addDraft.notes}),week:data.instance.week,actor:addDraft.name});data.registrations=data.registrations.filter(q=>q.memberId!==id).concat(r);saved.add(id);highlight=id;notice=addDraft.name+' added with their preferences. Pending officer approval.';addDraft={name:'',level:'',placement:'grass',confirmed:false,notes:'',memberId:null,alliance:''};adding=false;query='';}catch(e){error=e.message;}addBusy=false;render();};}
if(note){const dialog=document.getElementById('note-dialog');dialog.showModal();const input=document.getElementById('note-text');input.oninput=()=>note.text=input.value;if(!note.busy)input.focus();const close=()=>{if(note.busy)return;const id=note.id;note=null;render();app.querySelector(`[data-action="note"][data-id="${CSS.escape(id)}"]`)?.focus();};dialog.oncancel=e=>{e.preventDefault();close();};document.getElementById('note-cancel').onclick=close;document.getElementById('note-form').onsubmit=async e=>{e.preventDefault();if(note.busy)return;const current=note;if(current.id==='new-member'){addDraft.notes=current.text;close();return;}current.busy=true;render();const ok=await saveRow(current.id,{notes:current.text});if(ok){current.busy=false;close();}else{current.busy=false;current.error=error;render();}};}}
async function boot(){try{code=new URLSearchParams(location.hash.slice(1)).get('code')||sessionStorage.getItem('lastz-registration-code')||'';if(code){joining=true;render();data=await api('/api/registration/join','POST',{code});sessionStorage.setItem('lastz-registration-code',code);history.replaceState(null,'',location.pathname+location.search);}}catch(e){error=e.message;}joining=false;render();}
window.LASTZ_REGISTRATION={registrationBody,terrainLabel,nextTerrain};boot();})();
</script></body></html>
