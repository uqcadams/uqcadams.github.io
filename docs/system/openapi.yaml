components:
  securitySchemes:
    room:
      type: http
      scheme: bearer
      description: Normalized room capability; role/alliance enforced per operation.
    admin:
      type: http
      scheme: bearer
      description: Separate site admin key checked against ROOM_ADMIN_TOKEN_HASH.
    passcode:
      type: apiKey
      in: header
      name: X-Import-Passcode
  schemas:
    Error:
      type: object
      properties:
        error: *id002
        latest:
          $ref: '#/components/schemas/RoomState'
        weekChanged: *id005
        registration:
          type:
          - object
          - 'null'
        deploymentVersion: *id001
      additionalProperties: true
      required:
      - error
    Features:
      type: object
      properties:
        registration: *id005
        weekly: *id005
        allianceAccess: *id005
      additionalProperties: true
    Point:
      type: object
      properties:
        x: &id006
          type: number
        y: *id006
      additionalProperties: true
      required:
      - x
      - y
    Entity:
      type: object
      properties:
        id:
          type: string
          maxLength: 160
        name:
          type: string
          maxLength: 160
        alliance:
          type: string
          maxLength: 120
        level:
          type:
          - integer
          - 'null'
        colour: *id002
        x: *id001
        y: *id001
        locked: *id005
        hasMoved: *id005
        rosterStatus: *id002
        rosterSourceRoomId:
          type: string
        rosterSourceMemberId:
          type: string
      additionalProperties: true
      required:
      - id
      - name
    Region:
      type: object
      properties:
        id: *id002
        name: *id002
        points:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        parts:
          type: array
          items:
            type: array
            items:
              type: array
              items:
                type: array
                items: *id006
        layout: *id004
        ownerAlliance: *id002
        colour: *id002
        opacity: *id006
      additionalProperties: true
      required:
      - id
      - name
      - points
    Plan:
      type: object
      properties:
        homes:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        pool:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        outer:
          type: array
          items:
            type: array
            items: *id006
        inner:
          type: array
          items:
            type: array
            items: *id006
        excludedCells:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        anchorId:
          type:
          - string
          - 'null'
      additionalProperties: true
      required:
      - homes
      - pool
      - regions
      - outer
      - inner
    RoomState:
      type: object
      properties:
        room:
          type: object
          properties:
            id: *id002
            name: *id002
            features:
              $ref: '#/components/schemas/Features'
            currentWeek: *id003
            closed: *id005
          additionalProperties: true
        access:
          type: object
          properties:
            id: *id002
            role:
              type: string
              enum:
              - coordinator
              - officer
              - member
              - viewer
            alliance:
              type:
              - string
              - 'null'
            label: *id002
          additionalProperties: true
        instance:
          type: object
          properties:
            week: *id003
            version: *id001
            archived: *id005
            closed: *id005
            createdAt: *id002
            schedule:
              $ref: '#/components/schemas/Schedule'
          additionalProperties: true
        plan:
          $ref: '#/components/schemas/Plan'
        registrations:
          type: array
          items:
            $ref: '#/components/schemas/Registration'
      additionalProperties: true
    Schedule:
      type: object
      properties:
        week: *id003
        opens: *id002
        event: *id002
        scoring: *id002
        ends: *id002
        timezone: *id002
      additionalProperties: true
    Window:
      type: object
      properties:
        start:
          type: number
          minimum: -24
        end:
          type: number
          maximum: 72
      additionalProperties: true
      required:
      - start
      - end
    Registration:
      type: object
      properties:
        memberId: *id002
        status:
          type: string
          enum:
          - available
          - unavailable
          - unsure
          - unanswered
        placement:
          type: string
          enum:
          - grass
          - mud
          - either
          - discuss
        role:
          type: string
          enum:
          - flexible
          - fighter
          - rally-lead
          - reinforcement
          - support
          - scout
        windows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
        notes:
          type: string
          maxLength: 1500
        updatedBy: *id002
        updatedAt: *id002
        version: *id001
      additionalProperties: true
    RegistrationWrite:
      type: object
      properties:
        week: *id003
        memberId: *id002
        version: *id001
        status: *id002
        placement: *id002
        role: *id002
        windows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
        notes: *id002
        actor: *id002
      additionalProperties: true
      required:
      - week
      - memberId
    MemberState:
      type: object
      properties:
        room: *id004
        access: *id004
        instance: *id004
        members:
          type: array
          items:
            $ref: '#/components/schemas/Entity'
        registrations:
          type: array
          items:
            $ref: '#/components/schemas/Registration'
        deploymentMaps:
          type: array
          items:
            $ref: '#/components/schemas/DeploymentMap'
      additionalProperties: true
    Change:
      type: object
      properties:
        op:
          type: string
          enum:
          - setting
          - order
          - add
          - remove
          - patch
        collection:
          type: string
          enum:
          - homes
          - pool
          - regions
        id: *id002
        key:
          type: string
          enum:
          - outer
          - inner
          - excludedCells
          - anchorId
        before: {}
        value: {}
        entity: *id004
        fields: *id004
        beforePresent:
          type: object
          properties: {}
          additionalProperties: true
        removeFields:
          type: array
          items: *id002
        beforeIds:
          type: array
          items: *id002
        ids:
          type: array
          items: *id002
      additionalProperties: true
      required:
      - op
    DeploymentWrite:
      type: object
      properties:
        week: *id003
        alliance: *id002
        version: *id001
        homes:
          type: array
          items:
            type: object
            properties:
              memberId: *id002
              x: *id001
              y: *id001
            additionalProperties: true
            required:
            - memberId
            - x
            - y
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        outer:
          type: array
          items:
            type: array
            items: *id006
        inner:
          type: array
          items:
            type: array
            items: *id006
        excludedCells:
          type: array
          items:
            $ref: '#/components/schemas/Point'
      additionalProperties: true
      required:
      - week
      - alliance
      - version
      - homes
    DeploymentMap:
      type: object
      properties:
        alliance: *id002
        origin: *id002
        planVersion: *id001
        version: *id001
        updatedAt: *id002
        regions:
          type: array
          items:
            $ref: '#/components/schemas/Region'
        outer:
          type: array
          items:
            type: array
            items: *id006
        inner:
          type: array
          items:
            type: array
            items: *id006
        excludedCells:
          type: array
          items:
            $ref: '#/components/schemas/Point'
        assignments:
          type: array
          items:
            type: object
            properties:
              memberId: *id002
              name: *id002
              level:
                type:
                - integer
                - 'null'
              alliance: *id002
              colour: *id002
              x:
                type:
                - integer
                - 'null'
              y:
                type:
                - integer
                - 'null'
              lastX:
                type:
                - integer
                - 'null'
              lastY:
                type:
                - integer
                - 'null'
              status:
                type: string
                enum:
                - not-deployed
                - deployed
                - updated
            additionalProperties: true
      additionalProperties: true
    Budget:
      type: object
      properties:
        limitUsd: *id006
        accountedUsd: *id006
        remainingUsd: *id006
        includesHistoricalAllowanceUsd: *id006
        canImport: *id005
      additionalProperties: true
    CodeIssue:
      type: object
      properties:
        role: *id002
        alliance: *id002
        label: *id002
      additionalProperties: true
      required:
      - role
    Capability:
      type: object
      properties:
        id: *id002
        role: *id002
        alliance:
          type:
          - string
          - 'null'
        label: *id002
        code: *id002
        revoked: *id001
        created_at: *id002
      additionalProperties: true
